<style>
:root{
  --bg:#EEF5F6; --surface:#FFFFFF; --ink:#0D2A30; --ink-soft:#4C6A70; --ink-faint:#8FA6AB;
  --teal:#0F5C6E; --teal-deep:#0A2E38; --frost:#17B6CE; --frost-pale:#DBF3F7;
  --sky:#3E8FA6; --sky-pale:#DCEEF2;
  --amber:#E08A2B; --amber-pale:#FCEEDA; --green:#1F9D66; --green-pale:#DEF5E9;
  --red:#D14C46; --red-pale:#FBE2E0; --border:#DAE7E8;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(13,42,48,.05),0 4px 14px rgba(13,42,48,.06);
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:15px;}
button{cursor:pointer;}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--frost);box-shadow:0 0 0 3px var(--frost-pale);}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
.field{margin-bottom:14px;}
.hidden{display:none !important;}
#app{display:flex;flex-direction:column;min-height:100vh;max-width:520px;margin:0 auto;background:var(--bg);}
.topbar{background:linear-gradient(135deg,var(--teal-deep),var(--teal) 130%);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(10,46,56,.18);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,var(--frost),var(--teal) 120%);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;}
.brand-text{line-height:1.15;}
.brand-text .name{font-family:var(--font-display);font-weight:700;font-size:16.5px;letter-spacing:.1px;}
.brand-text .who{font-size:11.5px;color:#A9D4DA;margin-top:1px;}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;}
.content{flex:1;padding:16px 16px 92px 16px;overflow-y:auto;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 4px) 4px;overflow-x:auto;box-shadow:0 -2px 10px rgba(13,42,48,.04);}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;background:none;border:none;padding:8px 2px 6px 2px;border-radius:10px;color:var(--ink-faint);font-size:10px;font-weight:600;position:relative;}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--teal);}
.navbtn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--frost);}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;max-width:420px;margin:0 auto;}
.login-hero{text-align:center;margin-bottom:32px;}
.login-hero .brand-mark{width:58px;height:58px;border-radius:18px;font-size:28px;margin:0 auto 16px auto;box-shadow:0 8px 24px rgba(15,92,110,.28);}
.login-hero h1{font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--teal-deep);letter-spacing:.2px;}
.login-hero p{color:var(--ink-soft);font-size:13.5px;margin-top:5px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.role-opt{padding:14px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);transition:all .15s;}
.role-opt .ic{display:block;font-size:21px;margin-bottom:4px;}
.role-opt.active{border-color:var(--frost);background:var(--frost-pale);color:var(--teal-deep);}
.primary-btn{width:100%;padding:13px;background:var(--teal);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:14.5px;margin-top:6px;transition:background .15s;}
.primary-btn:active{background:var(--teal-deep);}
.primary-btn:disabled{opacity:.5;}
.ghost-btn{width:100%;padding:12px;background:none;color:var(--teal);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;}
.error-msg{color:var(--red);font-size:12.5px;margin-top:8px;text-align:center;}
.setup-note{background:var(--amber-pale);color:#8A5514;padding:11px 13px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:16px;line-height:1.55;border-left:3px solid var(--amber);}
.section-title{font-family:var(--font-display);font-size:15.5px;font-weight:600;color:var(--teal-deep);margin:2px 0 12px 0;letter-spacing:.1px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.item-name{font-weight:700;font-size:14.5px;color:var(--ink);}
.item-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.1px;}
.pill-amber{background:var(--amber-pale);color:#935B12;}
.pill-green{background:var(--green-pale);color:#146641;}
.pill-red{background:var(--red-pale);color:#932F2A;}
.pill-sky{background:var(--sky-pale);color:#1E5A6C;}
.pill-grey{background:#EAF1F1;color:var(--ink-soft);}
.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.mini-btn{flex:1;padding:9px 8px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);font-size:12px;font-weight:600;color:var(--ink);text-align:center;min-width:80px;transition:all .15s;}
.mini-btn.danger{color:var(--red);border-color:#F2CFCC;}
.mini-btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
.fab{position:fixed;bottom:80px;left:50%;transform:translateX(calc(-50%));margin-left:200px;width:54px;height:54px;border-radius:17px;background:linear-gradient(155deg,var(--frost),var(--teal) 130%);color:#fff;border:none;font-size:26px;box-shadow:0 8px 20px rgba(15,92,110,.35);z-index:21;}
@media (max-width:520px){ .fab{margin-left:0;right:18px;left:auto;transform:none;} }
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-num{font-family:var(--font-display);font-size:25px;font-weight:700;color:var(--teal-deep);letter-spacing:-.2px;}
.stat-label{font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:500;}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-faint);}
.empty-state .ic{font-size:34px;display:block;margin-bottom:10px;}
.empty-state p{font-size:13.5px;line-height:1.5;}
.searchbar{margin-bottom:14px;position:relative;}
.suggest-list{border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-top:-8px;margin-bottom:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);}
.suggest-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13.5px;}
.suggest-item:last-child{border-bottom:none;}
.suggest-item .n{font-weight:700;color:var(--ink);}
.suggest-item .p{font-size:12px;color:var(--ink-soft);}
.modal-overlay{position:fixed;inset:0;background:rgba(10,30,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
.modal-sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 20px) 18px;max-height:88vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h3{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--teal-deep);}
.close-x{background:none;border:none;font-size:22px;color:var(--ink-faint);padding:2px 6px;}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;box-shadow:0 6px 20px rgba(10,46,56,.3);max-width:90%;text-align:center;}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.dot-live{background:var(--green);box-shadow:0 0 0 3px var(--green-pale);} .dot-stale{background:var(--amber);} .dot-off{background:var(--ink-faint);}
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink-soft);padding:24px;text-align:center;}
.spinner{width:30px;height:30px;border:3px solid var(--frost-pale);border-top-color:var(--frost);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.share-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.switch{width:46px;height:26px;border-radius:20px;background:var(--border);position:relative;border:none;flex-shrink:0;transition:background .15s;}
.switch.on{background:var(--green);}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on .knob{left:23px;}
.photo-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.photo-thumb{width:56px;height:56px;border-radius:9px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
.urlbox{word-break:break-all;font-size:11px;background:var(--bg);padding:9px 10px;border-radius:8px;color:var(--ink-soft);margin-top:6px;font-family:monospace;}
.tabbar{display:flex;gap:4px;margin-bottom:14px;background:var(--surface);padding:4px;border-radius:11px;border:1px solid var(--border);overflow-x:auto;}
.tabbtn{flex:1;padding:8px 10px;border:none;background:none;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;transition:all .15s;}
.tabbtn.active{background:var(--teal);color:#fff;}
.section-sub{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--teal-deep);margin:16px 0 8px 0;padding-top:12px;border-top:1px solid var(--border);}
</style>

<body>
<div id="app"></div>

<script>
/* ============ Backend config (Google Apps Script Web App URL) ============ */
/* ============ Firebase (main data) + Apps Script (email only) config ============ */
const DEFAULT_FIREBASE_CONFIG='{\"apiKey\":\"AIzaSyCY89nm41X9tADB5KSK8m6o5nl3nqVXr-g\",\"authDomain\":\"sheetaltrack.firebaseapp.com\",\"projectId\":\"sheetaltrack\",\"storageBucket\":\"sheetaltrack.firebasestorage.app\",\"messagingSenderId\":\"919097584832\",\"appId\":\"1:919097584832:web:54b380b1042a9e4ced5125\"}';
const DEFAULT_EMAIL_URL='https://script.google.com/macros/s/AKfycbxylRUmian1V_9bGSJ7NGLNAht4bpQzEIvOSzpuaVx28nkkvGhAVD3gGjM9d8RbogyXeA/exec';
function getFirebaseConfig(){
  try{ const raw=localStorage.getItem('sheetaltrack_firebase_config')||DEFAULT_FIREBASE_CONFIG; return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function setFirebaseConfig(cfg){ try{ localStorage.setItem('sheetaltrack_firebase_config', JSON.stringify(cfg)); }catch(e){} }
function clearFirebaseConfig(){ try{ localStorage.removeItem('sheetaltrack_firebase_config'); }catch(e){} }
function getEmailUrl(){ try{ return localStorage.getItem('sheetaltrack_email_url')||DEFAULT_EMAIL_URL||''; }catch(e){ return DEFAULT_EMAIL_URL||''; } }
function setEmailUrl(u){ try{ localStorage.setItem('sheetaltrack_email_url', u); }catch(e){} }

let firestoreDB=null;
function initFirestore(){
  const cfg=getFirebaseConfig(); if(!cfg) return false;
  try{
    if(!firebase.apps || firebase.apps.length===0){ firebase.initializeApp(cfg); }
    firestoreDB=firebase.firestore(); try{ firestoreDB.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
    return true;
  }catch(e){ console.error('firebase init failed', e); return false; }
}

async function loadKeyRaw(key){
  if(!firestoreDB) throw new Error('not connected');
  const doc=await firestoreDB.collection('sheetaltrack_data').doc(key).get();
  if(!doc.exists) return undefined;
  const data=doc.data();
  if(data.value===undefined || data.value===null || data.value==='') return undefined;
  return JSON.parse(data.value);
}
async function loadKey(key, fallback){
  for(let attempt=0; attempt<3; attempt++){
    try{
      const v=await loadKeyRaw(key);
      return v===undefined ? fallback : v;
    }catch(e){
      console.error('load failed (attempt '+(attempt+1)+')', key, e);
      if(attempt<2) await new Promise(r=>setTimeout(r, 500*(attempt+1)));
    }
  }
  throw new Error('load-failed:'+key);
}
const COLL={st_media:'st_media',st_staff:'st_staff',st_customers:'st_customers',st_jobs:'st_jobs'};
const MAPK={st_locations:'st_loc',st_attendance:'st_att'};
const SYNCED={}; let PENDING=0;
function syncBadge(){ const b=document.getElementById('syncBadge'); if(b) b.textContent=PENDING>0?'⏳ Sync ho raha hai':'✅ Saved'; }
function track(p){ PENDING++; syncBadge(); p.then(()=>{PENDING--;syncBadge();},(e)=>{PENDING--;syncBadge();console.error('write failed',e);showToast('⚠️ Server par save nahi hua — internet/permission check karein');}); return p; }
async function saveKey(key, value){
  if(!firestoreDB) return false;
  try{
    const db=firestoreDB, S=SYNCED[key]||(SYNCED[key]=new Map());
    if(COLL[key]){
      const ids=new Set();
      value.forEach(r=>{ if(!r||!r.id) return; ids.add(r.id); const js=JSON.stringify(r); if(S.get(r.id)!==js){ S.set(r.id,js); track(db.collection(COLL[key]).doc(r.id).set(Object.assign(JSON.parse(js),{deleted:false}),{merge:true})); } });
      [...S.keys()].forEach(id=>{ if(!ids.has(id)){ S.delete(id); track(db.collection(COLL[key]).doc(id).set({deleted:true,deletedAt:Date.now()},{merge:true})); } });
    } else if(MAPK[key]){
      Object.keys(value||{}).forEach(k=>{ const js=JSON.stringify(value[k]); if(S.get(k)!==js){ S.set(k,js); const o=JSON.parse(js); track(db.collection(MAPK[key]).doc(k).set(key==='st_attendance'?{dates:o}:o,{merge:true})); } });
    } else { track(db.collection('sheetaltrack_data').doc(key).set({value: JSON.stringify(value)})); }
    return true;
  }catch(e){ console.error('save failed',key,e); showToast('⚠️ Save nahi hua'); return false; }
}
/* ============ Old Apps Script backend — used ONLY for sending email, and one-time migration ============ */
async function fetchOldSheetKey(url, key){
  try{
    const res=await fetch(url+'?key='+encodeURIComponent(key));
    const data=await res.json();
    if(data.value===null || data.value===undefined || data.value==='') return undefined;
    return data.value;
  }catch(e){ return undefined; }
}
async function fetchOldSheetAll(url){
  const res=await fetch(url+'?action=exportAll');
  const data=await res.json();
  if(!data.ok) throw new Error('export failed');
  return data.data;
}

/* customers = unified master list: every contact (AMC / one-time / enquiry / quotation) lives here, one record */
const SKEY = { STAFF:'st_staff', CUSTOMERS:'st_customers', JOBS:'st_jobs', LOCATIONS:'st_locations', ATTENDANCE:'st_attendance', BUSINESS:'st_business', PHOTO_COUNTS:'st_photo_counts' };
function photoKey(jobId, idx){ return 'photo_'+jobId+'_'+idx; }
function jobSigKey(jobId){ return 'sig_job_'+jobId; }
function techSigKey(jobId){ return 'sig_tech_'+jobId; }
function amcSigKey(custId){ return 'sig_amc_'+custId; }

let STATE = {
  booting:true, backendConnected:false, backendError:'',
  loading:true, loadFailed:false,
  staff:[], customers:[], jobs:[], locations:{}, attendance:{}, photos:{}, signatures:{}, techSignatures:{}, amcSignatures:{},
  businessInfo:{name:'Super Air Cool', phone:'', address:'', terms:''},
  session:null, view:'dashboard', toast:null,
  sharingLocation:false, watchId:null, custSearch:'', custTypeFilter:'all', customerDetailId:null, staffDetailId:null, lightboxSrc:null,
};

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escObj(o){const r={...o};Object.keys(r).forEach(k=>{if(typeof r[k]==='string')r[k]=esc(r[k]);});return r;}
let renderPending=false;
function bgRender(){ const a=document.activeElement; if(activeModal||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){ renderPending=true; return; } renderPending=false; render(); }
document.addEventListener('focusout',()=>setTimeout(()=>{ if(renderPending) bgRender(); },400));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){ return ymd(new Date()); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function addMonths(s,m){const [y,mo,da]=String(s).slice(0,10).split('-').map(Number);const n=Number(m)||0;const last=new Date(y,mo+n,0).getDate();return ymd(new Date(y,mo-1+n,Math.min(da,last)));}
function daysUntil(dateStr){ const d=new Date(dateStr), n=new Date(todayStr()); return Math.round((d-n)/86400000); }
function rupee(n){ return '₹'+Number(n||0).toLocaleString('en-IN'); }
function showToast(msg){ let t=document.getElementById('toastEl'); if(!t){ t=document.createElement('div'); t.id='toastEl'; t.className='toast'; document.body.appendChild(t); } t.textContent=msg; t.style.display='block'; clearTimeout(showToast._t); showToast._t=setTimeout(()=>{ t.style.display='none'; },2800); }

/* ============ Boot ============ */
async function boot(){
  const cfg=getFirebaseConfig();
  if(!cfg){ STATE.booting=false; STATE.backendConnected=false; render(); return; }
  try{
    const ok=initFirestore();
    if(!ok) throw new Error('init failed');
    await Promise.race([firestoreDB.collection('sheetaltrack_data').doc('st_business').get().catch(()=>{}), new Promise(r=>setTimeout(r,4000))]);
    STATE.backendConnected=true; STATE.booting=false; render();
    await init();
  }catch(e){
    console.error('firestore connect failed', e);
    STATE.booting=false; STATE.backendConnected=false; STATE.backendError='Connect nahi ho paya. Firebase config check karein.'; render();
  }
}

let LISTENING=false;
function attachListeners(){
  const cfg=[['st_staff','staff','arr'],['st_customers','customers','arr'],['st_jobs','jobs','arr'],['st_media','media','arr'],['st_locations','locations','loc'],['st_attendance','attendance','att']];
  return Promise.all(cfg.map(([key,prop,kind])=>new Promise((res,rej)=>{
    let first=true;
    firestoreDB.collection(COLL[key]||MAPK[key]).onSnapshot(snap=>{
      const S=new Map(); const v=kind==='arr'?[]:{};
      snap.forEach(d=>{ const r=d.data(); if(r.deleted) return;
        if(kind==='arr'){ r.id=r.id||d.id; v.push(r); S.set(r.id,JSON.stringify(r)); }
        else{ const o=kind==='att'?(r.dates||{}):r; v[d.id]=o; S.set(d.id,JSON.stringify(o)); } });
      STATE[prop]=v; SYNCED[key]=S;
      if(first){ first=false; res(); } else bgRender();
    },e=>{ console.error('listen failed',key,e); if(first){ first=false; rej(e); } else showToast('⚠️ Live sync ruk gaya — page reload karein'); });
  })));
}
async function migrateLegacy(){
  const db=firestoreDB, flagRef=db.collection('sheetaltrack_data').doc('st_migrated_v2');
  let flag; try{ flag=await flagRef.get(); }catch(e){ return; }
  if(flag.exists) return;
  const ops=[];
  for(const key of ['st_staff','st_customers','st_jobs']){
    let arr; try{ arr=await loadKey(key,[]); }catch(e){ return; }
    const have=SYNCED[key]||new Map();
    (arr||[]).forEach(r=>{ if(r&&r.id&&!have.has(r.id)) ops.push([db.collection(COLL[key]).doc(r.id),Object.assign(r,{deleted:false}),{merge:true}]); });
  }
  let att; try{ att=await loadKey('st_attendance',{}); }catch(e){ return; }
  Object.keys(att||{}).forEach(k=>ops.push([db.collection('st_att').doc(k),{dates:att[k]},{merge:true}]));
  for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(o=>b.set(o[0],o[1],o[2])); await b.commit(); }
  await flagRef.set({at:Date.now(),count:ops.length});
}

/* ============ Customer import (Excel/CSV) — smart header detection ============ */
function parseCsvLine(line){
  const out=[]; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ inQuotes=!inQuotes; }
    else if(ch===',' && !inQuotes){ out.push(cur); cur=''; }
    else{ cur+=ch; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function findCol(headers, candidates){
  for(const cand of candidates){
    const idx=headers.findIndex(h=>h.includes(cand));
    if(idx!==-1) return idx;
  }
  return -1;
}
function findHeaderRowIndex(rows){
  const keywords=['name','naam','customer','phone','contact','mobile','address','date','brand','model','amount','amt','year','serial','card'];
  let bestIdx=0, bestScore=-1;
  for(let i=0;i<Math.min(15, rows.length);i++){
    const rowLower=(rows[i]||[]).map(c=>String(c||'').toLowerCase().trim());
    const nonEmpty=rowLower.filter(c=>c!=='').length;
    if(nonEmpty<2) continue;
    let score=0;
    rowLower.forEach(cell=>{ if(keywords.some(k=>cell.includes(k))) score++; });
    if(score>bestScore){ bestScore=score; bestIdx=i; }
  }
  return bestScore>=2 ? bestIdx : 0;
}
function parseAnyDate(s){
  if(!s) return '';
  const t=String(s).trim();
  if(!t) return '';
  const d=new Date(t);
  if(!isNaN(d.getTime()) && d.getFullYear()>1950) return d.toISOString().slice(0,10);
  const m=t.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [_,a,b,y]=m; if(y.length===2) y='20'+y;
    const d2=new Date(Number(y), Number(b)-1, Number(a));
    if(!isNaN(d2.getTime())) return d2.toISOString().slice(0,10);
  }
  return '';
}
async function processCustomerRows(rows){
  if(rows.length<2){ showToast('File mein data nahi mila'); return; }
  const headerRowIdx=findHeaderRowIndex(rows);
  const headers=rows[headerRowIdx].map(s=>String(s).toLowerCase().trim());
  const colName=findCol(headers,['customer name','naam','name','customer']);
  const colPhone=findCol(headers,['mobile no','contact no','phone','mobile','number']);
  const colPhone2=findCol(headers,['residential tel','tel no','telephone','landline']);
  const colAddress1=findCol(headers,['address1','address 1','address']);
  const colAddress2=findCol(headers,['address2','address 2']);
  const colAddress3=findCol(headers,['address3','address 3']);
  const colArea=findCol(headers,['area']);
  const colDate=findCol(headers,['date']);
  const colEndDate=findCol(headers,['end date','expiry']);
  const colYear=findCol(headers,['year']);
  const colProduct=findCol(headers,['product']);
  const colBrand=findCol(headers,['brand']);
  const colModel=findCol(headers,['model']);
  const colSerial=findCol(headers,['serial','card no']);
  const colAmt=findCol(headers,['amt','amount']);
  const colTech=findCol(headers,['tecnician','technician','telly caller','caller']);
  const colWarranty=findCol(headers,['warranty']);
  const colEmail=findCol(headers,['email','e-mail']);
  const colNotes=findCol(headers,['notes','description']);
  if(colName===-1){ showToast('Customer naam wala column nahi mila'); return; }
  let added=0, skipped=0;
  for(let i=headerRowIdx+1;i<rows.length;i++){
    const cols=rows[i];
    const name=(cols[colName]||'').trim();
    if(!name){ skipped++; continue; }
    const phoneRaw=(colPhone>-1?(cols[colPhone]||''):'').replace(/[^0-9\/,]/g,'');
    const phoneParts=phoneRaw.split(/[\/,]/).map(s=>s.trim()).filter(Boolean);
    const phone=phoneParts[0]||''; let phone2=phoneParts[1]||'';
    if(!phone2 && colPhone2>-1){ phone2=(cols[colPhone2]||'').replace(/[^0-9]/g,'').trim(); }
    const addrParts=[colAddress1,colAddress2,colAddress3].map(ci=>ci>-1?(cols[ci]||'').trim():'').filter(Boolean);
    let address=addrParts.join(', ');
    const area=(colArea>-1?(cols[colArea]||''):'').trim();
    if(area) address=address?address+', '+area:area;
    let activationDate=colDate>-1?parseAnyDate(cols[colDate]):'';
    if(!activationDate) activationDate=todayStr();
    let expiryDate=colEndDate>-1?parseAnyDate(cols[colEndDate]):'';
    let totalServices=0;
    if(colYear>-1){ const ym=(cols[colYear]||'').match(/(\d+)/); if(ym) totalServices=Number(ym[1])*4; }
    if(!expiryDate && totalServices) expiryDate=addMonths(activationDate,12);
    const productVal=colProduct>-1?(cols[colProduct]||''):'';
    const isAmcLike = colBrand>-1 || colProduct>-1 || colEndDate>-1 || colYear>-1;
    STATE.customers.push({id:uid(), name, type:isAmcLike?'amc':'onetime', phone, phone2, email:colEmail>-1?(cols[colEmail]||''):'', address, landmark:'', city:'', state:'', pincode:'',
      lastService:activationDate, intervalMonths:3,
      amcName:isAmcLike?name+' AMC':'', brand:colBrand>-1?(cols[colBrand]||''):productVal, model:colModel>-1?(cols[colModel]||''):'', serialNo:colSerial>-1?(cols[colSerial]||''):'',
      underWarranty:colWarranty>-1?/yes/i.test(cols[colWarranty]||''):false, activationDate:isAmcLike?activationDate:'', expiryDate, totalServices, servicesDone:0,
      source:colTech>-1?(cols[colTech]||''):'', amcAmount:colAmt>-1?(Number(String(cols[colAmt]).replace(/[^0-9.]/g,''))||0):0,
      leadStatus:'new', notes:colNotes>-1?(cols[colNotes]||''):''});
    added++;
  }
  if(added===0){ showToast('Koi valid customer row nahi mila'); return; }
  await saveKey(SKEY.CUSTOMERS, STATE.customers);
  showToast(added+' customers import ho gaye'+(skipped?' ('+skipped+' khaali rows skip hui)':'')); render();
}
async function importCustomersCsv(file){
  try{
    const text=await file.text();
    const lines=text.split(/\r?\n/).filter(l=>l.trim().length>0);
    const rows=lines.map(l=>parseCsvLine(l));
    await processCustomerRows(rows);
  }catch(e){ showToast('File read nahi ho payi'); }
}
async function importCustomersXlsx(file){
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf, {type:'array', cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws, {header:1, raw:false, dateNF:'yyyy-mm-dd', defval:''});
    const cleanRows=rows.filter(r=>r.some(c=>String(c||'').trim()!=='')).map(r=>r.map(c=>String(c==null?'':c)));
    await processCustomerRows(cleanRows);
  }catch(e){ console.error(e); showToast('Excel file read nahi ho payi'); }
}

/* ============ Signature Pad (canvas) ============ */
let sigDrawing=false; const sigHasDrawnMap={};
function initSignaturePad(canvasId){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  sigHasDrawnMap[canvasId]=false;
  ctx.strokeStyle='#122327'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  function pos(e){
    const rect=canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height)};
  }
  function start(e){ e.preventDefault(); sigDrawing=true; sigHasDrawnMap[canvasId]=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!sigDrawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(e){ sigDrawing=false; }
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
function clearSignaturePad(canvasId){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); sigHasDrawnMap[canvasId]=false;
}
function getSignatureDataUrl(canvasId){
  const canvas=document.getElementById(canvasId); if(!canvas || !sigHasDrawnMap[canvasId]) return '';
  return canvas.toDataURL('image/png');
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=480; const scale=Math.min(1, maxW/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.45));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
async function addJobPhoto(jobId, file){
  try{ const data=await compressImage(file); const id=uid();
    track(firestoreDB.collection('st_media').doc(id).set({id,jobId,type:'photo',data,ts:Date.now(),by:(STATE.session&&STATE.session.name)||'',deleted:false}));
    showToast('📷 Photo save ho rahi hai'); }
  catch(e){ showToast('Photo process nahi ho payi'); }
}

function render(){
  if(REC.stream&&activeModal&&activeModal.type==='recVideo') return;
  if(!(activeModal&&activeModal.type==='recVideo')) stopRecStream();
  const app=document.getElementById('app');
  if(STATE.booting){ app.innerHTML=`<div class="loading-screen"><div class="brand-mark" style="width:56px;height:56px;border-radius:16px;font-size:28px;margin-bottom:4px;">❄️</div><div class="spinner"></div><div>Check ho raha hai…</div></div>`; return; }
  if(!STATE.backendConnected){ app.innerHTML=renderSetup(); bindSetupEvents(); return; }
  if(STATE.loading){ app.innerHTML=`<div class="loading-screen"><div class="brand-mark" style="width:56px;height:56px;border-radius:16px;font-size:28px;margin-bottom:4px;">❄️</div><div class="spinner"></div><div>Data load ho raha hai…</div></div>`; return; }
  if(STATE.loadFailed){
    app.innerHTML=`<div class="loading-screen"><div style="font-size:34px;">⚠️</div><div style="max-width:300px;">Connection slow/fail ho gaya — data load nahi ho paya. Kuch bhi save nahi hua, dobara try karein.<div style="font-size:11px;margin-top:8px;color:var(--ink-faint);">v2.2 · Error: ${esc(STATE.loadErr||"")}</div></div><button class="primary-btn" id="retryLoadBtn" style="width:auto;padding:12px 24px;">Dobara Try Karein</button></div>`;
    const btn=document.getElementById('retryLoadBtn'); if(btn) btn.onclick=()=>init();
    return;
  }
  if(!STATE.session){ app.innerHTML=renderLogin(); bindLoginEvents(); return; }
  app.innerHTML=renderShell(); bindShellEvents();
}

    <div class="setup-note">Yeh app ab Firebase (Google ka free real-time database) use karti hai — pehle se tez aur reliable. Firebase Console se apna config copy karke neeche paste karein.</div>
    <div class="field"><label>Firebase Config (poora object paste karein)</label><textarea id="setupConfig" rows="8" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", ...}'>${setupUrlInput}</textarea></div>
    <button class="primary-btn" id="connectBtn">Connect Karein</button>
    ${STATE.backendError?`<div class="error-msg">${STATE.backendError}</div>`:''}
  </div>`;
}
function bindSetupEvents(){
  const input=document.getElementById('setupConfig'); if(input) input.oninput=(e)=>{ setupUrlInput=e.target.value; };
  const btn=document.getElementById('connectBtn');
  const doConnect=async ()=>{
    let raw=(document.getElementById('setupConfig')||{}).value.trim();
    if(!raw){ STATE.backendError='Firebase config paste karein'; render(); return; }
    raw=raw.replace(/^(const|let|var)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'');
    let cfg;
    try{ cfg=JSON.parse(raw); }
    catch(e){
      try{ cfg=Function('return ('+raw+')')(); }
      catch(e2){ STATE.backendError='Config sahi format mein nahi hai — poora {...} object paste karein'; render(); return; }
    }
    if(!cfg || !cfg.projectId){ STATE.backendError='Config mein projectId nahi mila — sahi Firebase config paste karein'; render(); return; }
    STATE.backendError=''; STATE.booting=true; render();
    setFirebaseConfig(cfg);
    await boot();
  };
  if(btn) btn.onclick=doConnect;
}

/* ============ Dashboard ============ */
function jobInPeriod(job, period){
  if(period==='total') return true;
  const d=new Date(job.date);
  const now=new Date();
  if(period==='today') return job.date===todayStr();
  if(period==='week'){ const start=new Date(now); start.setDate(now.getDate()-7); return d>=start && d<=now; }
  if(period==='month'){ return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }
  if(period==='year'){ return d.getFullYear()===now.getFullYear(); }
  return true;
}

        <div data-jobstatusfilter="ongoing" style="cursor:pointer;"><div style="font-size:20px;font-weight:800;color:var(--amber);">${ongoingJobs.length}</div><div class="item-sub">Ongoing ›</div></div>

    <div class="card">

function renderAmcCalendar(){
  if(STATE.calendarYear===undefined){ const now=new Date(); STATE.calendarYear=now.getFullYear(); STATE.calendarMonth=now.getMonth(); }
  const y=STATE.calendarYear, m=STATE.calendarMonth;
  const amcList=STATE.customers.filter(c=>c.type==='amc' && c.expiryDate);
  const monthAmc=amcList.filter(c=>{ const d=new Date(c.expiryDate); return d.getFullYear()===y && d.getMonth()===m; });
  const byDay={};
  monthAmc.forEach(c=>{ const day=new Date(c.expiryDate).getDate(); if(!byDay[day]) byDay[day]=[]; byDay[day].push(c); });
  const firstDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthName=new Date(y,m,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  let cells='';
  for(let i=0;i<firstDow;i++){ cells+=`<div></div>`; }
  for(let d=1;d<=daysInMonth;d++){
    const has=byDay[d];
    cells+=`<div style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:${has?'var(--amber-pale)':'var(--surface)'};border:1px solid var(--border);font-size:12px;">
      <div>${d}</div>${has?`<div style="width:6px;height:6px;border-radius:50%;background:var(--amber);margin-top:2px;"></div>`:''}
    </div>`;
  }
  return `
    <div class="tabbar"><button class="tabbtn" data-navto="customers">List</button><button class="tabbtn active" data-navto="amccal">AMC Calendar</button></div>
    <div class="row-between" style="margin-bottom:12px;align-items:center;">
      <button class="mini-btn" id="calPrevBtn" style="flex:none;padding:8px 14px;">‹ Prev</button>
      <div class="section-title" style="margin:0;">${monthName}</div>
      <button class="mini-btn" id="calNextBtn" style="flex:none;padding:8px 14px;">Next ›</button>
    </div>
    <div class="field" style="margin-bottom:16px;"><label>Seedha saal/mahina jump karein</label>
      <div style="display:flex;gap:8px;">
        <select id="calMonthSelect" style="flex:1;">${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((mn,i)=>`<option value="${i}" ${i===m?'selected':''}>${mn}</option>`).join('')}</select>
        <select id="calYearSelect" style="flex:1;">${Array.from({length:8},(_,i)=>y-4+i).map(yr=>`<option value="${yr}" ${yr===y?'selected':''}>${yr}</option>`).join('')}</select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px;">
      ${['S','M','T','W','T','F','S'].map(d=>`<div style="text-align:center;font-size:11px;color:var(--ink-faint);font-weight:700;">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="section-title">${monthName} mein expire ho rahe hain (${monthAmc.length})</div>
    ${monthAmc.length===0?`<div class="empty-state"><span class="ic">✅</span><p>Is mahine koi AMC expire nahi ho raha.</p></div>`:
      monthAmc.slice().sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate)).map(c=>`<div class="card"><div class="row-between" data-viewcust="${c.id}" style="cursor:pointer;"><div><div class="item-name">${c.name} ›</div><div class="item-sub">Expiry: ${fmtDate(c.expiryDate)}</div></div></div></div>`).join('')}
  `;
}

      techs.map(t=>{ const loc=STATE.locations[t.id]; const age=loc?Date.now()-loc.ts:null; let dot='dot-off', label='Location off / kabhi share nahi ki';
        if(loc){ if(age<10*60*1000){ dot='dot-live'; label='Live · '+Math.round(age/60000)+' min pehle'; } else{ dot='dot-stale'; label='Last seen · '+new Date(loc.ts).toLocaleString('en-IN'); } }
        const mapLink=loc?`https://www.google.com/maps?q=${loc.lat},${loc.lng}`:'';
        return `<div class="card"><div class="row-between"><div><div class="item-name"><span class="status-dot ${dot}"></span>${t.name}</div><div class="item-sub">${label}</div></div></div>${loc?`<div class="card-actions"><a class="mini-btn primary" style="text-decoration:none;display:block;" href="${mapLink}" target="_blank">Google Maps mein dekhein</a></div>`:''}</div>`; }).join('')}

let liveMapInstance=null;
function initLiveMap(){
  const container=document.getElementById('liveMapBox');
  if(!container || typeof L==='undefined') return;
  if(liveMapInstance){ liveMapInstance.remove(); liveMapInstance=null; }
  const techs=STATE.staff.filter(s=>s.role==='technician').filter(t=>STATE.locations[t.id]);
  if(techs.length===0) return;
  const first=STATE.locations[techs[0].id];
  liveMapInstance=L.map('liveMapBox').setView([first.lat, first.lng], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:19 }).addTo(liveMapInstance);
  const bounds=[];
  techs.forEach(t=>{
    const loc=STATE.locations[t.id];
    const age=Date.now()-loc.ts; const live=age<10*60*1000;
    const marker=L.marker([loc.lat, loc.lng]).addTo(liveMapInstance);
    marker.bindPopup(`<b>${t.name}</b><br>${live?'Live · '+Math.round(age/60000)+' min pehle':'Last seen · '+new Date(loc.ts).toLocaleString('en-IN')}`);
    bounds.push([loc.lat, loc.lng]);
  });
  if(bounds.length>1){ liveMapInstance.fitBounds(bounds, {padding:[30,30]}); }
}

  const m=(STATE.media||[]).find(x=>x.id===id); if(!m) return; showToast('Video khul raha hai…');
  try{ const parts=[]; for(let i=0;i<m.chunks;i++){ const d=await firestoreDB.collection('st_mchunk').doc(id+'_'+i).get(); if(!d.exists) throw new Error('chunk missing'); parts.push(d.data().d); }
    const bin=atob(parts.join('')), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    STATE.lightboxVid=URL.createObjectURL(new Blob([u8],{type:m.mime||'video/webm'})); STATE.lightboxSrc=null; render();
  }catch(e){ console.error(e); showToast('Video load nahi hua — internet check karein'); }
}
const REC={on:false,stream:null,mr:null,chunks:[],timer:null,t0:0};
function stopRecStream(){
  if(REC.timer){ clearInterval(REC.timer); REC.timer=null; }
  try{ if(REC.mr&&REC.mr.state!=='inactive'){ REC.mr.onstop=null; REC.mr.stop(); } }catch(e){}
  if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream=null; }
  REC.on=false; REC.mr=null;
}
async function initRecorder(){
  const v=document.getElementById('recPreview'), btn=document.getElementById('recBtn'), tm=document.getElementById('recTimer'), jobId=activeModal.data.jobId;
  if(!navigator.mediaDevices||!window.MediaRecorder){ showToast('Is browser mein video record nahi hota — Chrome use karein'); activeModal=null; render(); return; }
  try{ REC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}},audio:true}); }
  catch(e){ showToast('Camera aur mic ki permission allow karein'); activeModal=null; render(); return; }
  v.srcObject=REC.stream;
  const mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  btn.onclick=()=>{
    if(REC.on){ REC.mr.stop(); return; }
    REC.chunks=[]; REC.mr=new MediaRecorder(REC.stream,{mimeType:mime||undefined,videoBitsPerSecond:300000,audioBitsPerSecond:24000});
    REC.mr.ondataavailable=e=>{ if(e.data&&e.data.size) REC.chunks.push(e.data); };
    REC.mr.onstop=async()=>{ const dur=Math.min(30,Math.round((Date.now()-REC.t0)/1000)), type=(REC.mr&&REC.mr.mimeType)||mime||'video/webm', blob=new Blob(REC.chunks,{type}); stopRecStream(); activeModal=null; render(); await saveVideo(jobId,blob,type,dur); };
    REC.t0=Date.now(); REC.on=true; REC.mr.start(1000); btn.textContent='⏹ Stop aur save karein';
    REC.timer=setInterval(()=>{ const sec=Math.floor((Date.now()-REC.t0)/1000); tm.textContent='0:'+String(Math.min(sec,30)).padStart(2,'0')+' / 0:30'; if(sec>=30&&REC.mr&&REC.mr.state==='recording') REC.mr.stop(); },250);
  };
}
async function saveVideo(jobId,blob,mime,dur){
  if(blob.size<1000){ showToast('Video record nahi hua'); return; }
  showToast('Video save ho raha hai…');
  const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
  if(b64.length>4000000){ showToast('Video bahut badi hai — chhota record karein'); return; }
  const id=uid(), CH=500000, n=Math.ceil(b64.length/CH), db=firestoreDB;
  for(let i=0;i<n;i++) track(db.collection('st_mchunk').doc(id+'_'+i).set({mid:id,i,d:b64.slice(i*CH,(i+1)*CH)}));
  track(db.collection('st_media').doc(id).set({id,jobId,type:'video',mime,chunks:n,dur,ts:Date.now(),by:(STATE.session&&STATE.session.name)||'',deleted:false}));
  showToast('✅ Video save ho gaya');
}

      <div class="field"><label>Customer Signature (optional)</label>
        <canvas id="sigCanvas" width="440" height="160" style="width:100%;border:1px solid var(--border);border-radius:8px;touch-action:none;background:#fff;"></canvas>
        <button type="button" class="mini-btn" id="clearSigBtn" style="margin-top:8px;">Clear Signature</button>
      </div>
      <div class="field"><label>Technician Signature (optional)</label>
        <canvas id="techSigCanvas" width="440" height="160" style="width:100%;border:1px solid var(--border);border-radius:8px;touch-action:none;background:#fff;"></canvas>
        <button type="button" class="mini-btn" id="clearTechSigBtn" style="margin-top:8px;">Clear Signature</button>
      </div>
      <button class="primary-btn" id="modalSave">Mark Done</button>`;
  }
  return `<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">${inner}</div></div>`;
}

/* ============ Event binding ============ */
function bindShellEvents(){
  const logoutBtn=document.getElementById('logoutBtn'); if(logoutBtn) logoutBtn.onclick=logout;
  document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{ STATE.view=b.dataset.view; STATE.jobStatusFilter=''; render(); });
  document.querySelectorAll('[data-navto]').forEach(el=>el.onclick=()=>{ STATE.view=el.dataset.navto; render(); });
  document.querySelectorAll('[data-typefilter]').forEach(el=>el.onclick=()=>{ STATE.custTypeFilter=el.dataset.typefilter; render(); });
  if(document.getElementById('liveMapBox')){ setTimeout(initLiveMap, 0); }
  document.querySelectorAll('[data-viewcust]').forEach(el=>el.onclick=()=>{ openCustomerProfile(el.dataset.viewcust); });
  document.querySelectorAll('[data-viewstaff]').forEach(el=>el.onclick=()=>{ STATE.staffDetailId=el.dataset.viewstaff; STATE.view='staffProfile'; render(); });
  document.querySelectorAll('[data-lightbox]').forEach(el=>el.onclick=()=>{ STATE.lightboxSrc=el.dataset.lightbox; render(); });
  document.querySelectorAll('[data-video]').forEach(el=>el.onclick=()=>openVideo(el.dataset.video));
  document.querySelectorAll('[data-settab]').forEach(el=>el.onclick=()=>{ STATE.setTab=el.dataset.settab; render(); });
  document.querySelectorAll('[data-checklist]').forEach(el=>el.onclick=()=>{ const [jobId,idx]=el.dataset.checklist.split(':'); toggleChecklistItem(jobId, Number(idx)); });
  const lightboxOverlay=document.getElementById('lightboxOverlay');
  if(lightboxOverlay){
    lightboxOverlay.onclick=(e)=>{ if(e.target===lightboxOverlay){ STATE.lightboxSrc=null; STATE.lightboxVid=null; render(); } };
    const lightboxClose=document.getElementById('lightboxClose'); if(lightboxClose) lightboxClose.onclick=()=>{ STATE.lightboxSrc=null; STATE.lightboxVid=null; render(); };
  }
  const calPrevBtn=document.getElementById('calPrevBtn');
  if(calPrevBtn) calPrevBtn.onclick=()=>{ STATE.calendarMonth--; if(STATE.calendarMonth<0){ STATE.calendarMonth=11; STATE.calendarYear--; } render(); };
  const calNextBtn=document.getElementById('calNextBtn');
  if(calNextBtn) calNextBtn.onclick=()=>{ STATE.calendarMonth++; if(STATE.calendarMonth>11){ STATE.calendarMonth=0; STATE.calendarYear++; } render(); };
  const calMonthSelect=document.getElementById('calMonthSelect');
  if(calMonthSelect) calMonthSelect.onchange=(e)=>{ STATE.calendarMonth=Number(e.target.value); render(); };
  const calYearSelect=document.getElementById('calYearSelect');
  if(calYearSelect) calYearSelect.onchange=(e)=>{ STATE.calendarYear=Number(e.target.value); render(); };
  const taskPeriodSelect=document.getElementById('taskPeriodSelect');
  if(taskPeriodSelect) taskPeriodSelect.onchange=(e)=>{ STATE.taskPeriod=e.target.value; render(); };
  document.querySelectorAll('[data-jobstatusfilter]').forEach(el=>el.onclick=()=>{ STATE.jobStatusFilter=el.dataset.jobstatusfilter; STATE.view='jobs'; render(); });
  const clearJobFilterBtn=document.getElementById('clearJobFilterBtn'); if(clearJobFilterBtn) clearJobFilterBtn.onclick=()=>{ STATE.jobStatusFilter=''; render(); };

  const addCustBtn=document.getElementById('addCustBtn'); if(addCustBtn) addCustBtn.onclick=()=>{ activeModal={type:'addCustomer'}; render(); };
  const addStaffBtn=document.getElementById('addStaffBtn'); if(addStaffBtn) addStaffBtn.onclick=()=>{ activeModal={type:'addStaff'}; render(); };
  const addJobBtn=document.getElementById('addJobBtn'); if(addJobBtn) addJobBtn.onclick=()=>{ jobCustQuery=''; jobCustSelectedId=''; activeModal={type:'addJob'}; render(); };
  const custSearchInput=document.getElementById('custSearchInput');
  if(custSearchInput){ custSearchInput.oninput=(e)=>{ STATE.custSearch=e.target.value; render(); }; setTimeout(()=>{ const el=document.getElementById('custSearchInput'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0); }
  const shareToggle=document.getElementById('shareToggle'); if(shareToggle) shareToggle.onclick=()=>{ if(STATE.sharingLocation) stopSharingLocation(); else startSharingLocation(); render(); };

  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=async ()=>{
    const act=el.dataset.act, id=el.dataset.id;
    if(act==='service'){ await markServiced(id); render(); }
    else if(act==='editcust'){ const c=STATE.customers.find(x=>x.id===id); activeModal={type:'editCustomer', data:{...c, id}}; render(); }
    else if(act==='viewcust'){ openCustomerProfile(id); }
    else if(act==='delcust'){ if(STATE.session.role!=='admin'){ showToast('Sirf Admin delete kar sakta hai'); return; } if(confirm('Customer delete karein?')){ await deleteCustomer(id); render(); } }
    else if(act==='amcservice'){ await markAmcServiceDone(id); render(); }
    else if(act==='amcpdf'){ await generateAmcPdf(id); }
    else if(act==='amcsign'){ activeModal={type:'amcSign', data:{id}}; render(); }
    else if(act==='jobstatus'){ let why=''; if(el.dataset.status==='onhold'){ why=prompt('Job hold karne ka reason likhein'); if(why===null) return; } await updateJobStatus(id, el.dataset.status, why); render(); }
    else if(act==='completejob'){ const j=STATE.jobs.find(x=>x.id===id); activeModal={type:'completeJob', data:{id, existingAmount:j?j.amount||0:0}}; render(); }
    else if(act==='recvideo'){ activeModal={type:'recVideo',data:{jobId:id}}; render(); }
    else if(act==='invoice'){ await generateInvoice(id); }
    else if(act==='deljob'){ if(STATE.session.role!=='admin'){ showToast('Sirf Admin delete kar sakta hai'); return; } if(confirm('Job delete karein?')){ await deleteJob(id); render(); } }
    else if(act==='delstaff'){ if(confirm('Remove karein?')){ await deleteStaff(id); render(); } }
    else if(act==='resetpin'){ const s=STATE.staff.find(x=>x.id===id); activeModal={type:'resetPin', data:{id, name:s.name}}; render(); }
  });
  document.querySelectorAll('[data-quickassign]').forEach(sel=>sel.onchange=async (e)=>{ await assignJobQuick(sel.dataset.quickassign, e.target.value); });
  document.querySelectorAll('[data-photojob]').forEach(inp=>inp.onchange=async (e)=>{ if(e.target.files[0]) await addJobPhoto(inp.dataset.photojob, e.target.files[0]); });

  const changePinBtn=document.getElementById('changePinBtn'); if(changePinBtn) changePinBtn.onclick=async ()=>{ await changeOwnPin(val('f_newOwnPin')); render(); };
  const saveBizBtn=document.getElementById('saveBizBtn'); if(saveBizBtn) saveBizBtn.onclick=async ()=>{ await saveBusinessInfo({name:val('f_bizname'), phone:val('f_bizphone'), address:val('f_bizaddress'), terms:val('f_bizterms')}); render(); };
  const exportBtn=document.getElementById('exportBtn'); if(exportBtn) exportBtn.onclick=exportData;
  const importBtn=document.getElementById('importBtn'); const importFile=document.getElementById('importFile');
  if(importBtn && importFile){ importBtn.onclick=()=>importFile.click(); importFile.onchange=(e)=>{ if(e.target.files[0]) importData(e.target.files[0]); }; }
  const importCsvBtn=document.getElementById('importCsvBtn'); const importCsvFile=document.getElementById('importCsvFile');
  if(importCsvBtn && importCsvFile){
    importCsvBtn.onclick=()=>importCsvFile.click();
    importCsvFile.onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const fname=f.name.toLowerCase();
      if(fname.endsWith('.xlsx')||fname.endsWith('.xls')){ importCustomersXlsx(f); }
      else if(fname.endsWith('.csv')){ importCustomersCsv(f); }
      else{ showToast('Sirf .csv, .xlsx ya .xls file chalegi'); }
    };
  }
  const clearCustBtn=document.getElementById('clearCustBtn');
  if(clearCustBtn) clearCustBtn.onclick=async ()=>{
    const confirmVal=(document.getElementById('clearConfirmInput')||{}).value||'';
    if(confirmVal.trim().toUpperCase()!=='DELETE'){ showToast('Pehle "DELETE" type karein confirm karne ke liye'); return; }
    await clearAllCustomers(); render();
  };
  const teamVersionBtn=document.getElementById('teamVersionBtn'); if(teamVersionBtn) teamVersionBtn.onclick=downloadTeamVersion;
  const sendRemindersBtn=document.getElementById('sendRemindersBtn'); if(sendRemindersBtn) sendRemindersBtn.onclick=sendAmcReminders;
  const disconnectBtn=document.getElementById('disconnectBtn');
  if(disconnectBtn) disconnectBtn.onclick=()=>{
    if(confirm('Yeh Firebase disconnect karke naya connect karna chahte hain?')){ clearFirebaseConfig(); STATE.backendConnected=false; STATE.session=null; STATE.loading=true; render(); }
  };
  const saveEmailUrlBtn=document.getElementById('saveEmailUrlBtn');
  if(saveEmailUrlBtn) saveEmailUrlBtn.onclick=()=>{ setEmailUrl(val('f_emailUrl')); showToast('Email URL save ho gaya'); };
  const migrateBtn=document.getElementById('migrateBtn');
  if(migrateBtn) migrateBtn.onclick=async ()=>{
    const oldUrl=val('f_migrateUrl');
    if(!oldUrl || !oldUrl.includes('script.google')){ showToast('Sahi purana Apps Script URL daalein'); return; }
    if(!confirm('Purana data Firebase mein copy karna hai? Isse kuch der lag sakti hai.')) return;
    migrateBtn.disabled=true; migrateBtn.textContent='Import ho raha hai...';
    try{
      const allData=await fetchOldSheetAll(oldUrl);
      const keys=Object.keys(allData);
      let done=0;
      for(const k of keys){
        await firestoreDB.collection('sheetaltrack_data').doc(k).set({value: allData[k]});
        done++;
      }
      showToast(done+' items import ho gaye — ab page reload karein');
      migrateBtn.textContent='✅ Import ho gaya ('+done+' items)';
    }catch(e){
      console.error(e); showToast('Import fail ho gaya — purana URL check karein');
      migrateBtn.disabled=false; migrateBtn.textContent='🔄 Purana Data Import Karein';
    }
  };

  const custTypeSelect=document.getElementById('f_custType');
  if(custTypeSelect){ custTypeSelect.onchange=(e)=>{ const wrap=document.getElementById('amcFieldsWrap'); if(wrap) wrap.style.display = e.target.value==='amc' ? '' : 'none'; }; }

  const overlay=document.getElementById('modalOverlay');
  if(overlay){
    overlay.onclick=(e)=>{ if(e.target===overlay){ activeModal=null; render(); } };
    const closeX=document.getElementById('modalClose'); if(closeX) closeX.onclick=()=>{ activeModal=null; render(); };
    if(document.getElementById('recBtn')) initRecorder();
    const custSearch=document.getElementById('f_custSearch');
    if(custSearch){ custSearch.oninput=(e)=>{ jobCustQuery=e.target.value; jobCustSelectedId=''; paintCustSuggest(); }; paintCustSuggest(); }
    if(document.getElementById('sigCanvas')){
      setTimeout(()=>initSignaturePad('sigCanvas'),0);
      const clearSigBtn=document.getElementById('clearSigBtn');
      if(clearSigBtn) clearSigBtn.onclick=()=>clearSignaturePad('sigCanvas');
      document.querySelectorAll('[data-star]').forEach(star=>star.onclick=()=>{
        const n=Number(star.dataset.star);
        document.getElementById('f_rating').value=n;
        document.querySelectorAll('[data-star]').forEach(s=>{ s.style.color = Number(s.dataset.star)<=n ? 'var(--amber)' : 'var(--border)'; });
      });
    }
    if(document.getElementById('techSigCanvas')){
      setTimeout(()=>initSignaturePad('techSigCanvas'),0);
      const clearTechSigBtn=document.getElementById('clearTechSigBtn');
      if(clearTechSigBtn) clearTechSigBtn.onclick=()=>clearSignaturePad('techSigCanvas');
    }
    const saveBtn=document.getElementById('modalSave');
    if(saveBtn) saveBtn.onclick=async ()=>{
      const originalLabel=saveBtn.textContent;
      saveBtn.disabled=true; saveBtn.style.opacity='0.7'; saveBtn.textContent='Save ho raha hai...';
      const resetBtn=()=>{ if(saveBtn){ saveBtn.disabled=false; saveBtn.style.opacity=''; saveBtn.textContent=originalLabel; } };
      try{
      if(activeModal.type==='addCustomer'){
        const name=val('f_name'); if(!name){ showToast('Naam zaroori hai'); resetBtn(); return; }
        await addCustomer({name, type:val('f_custType'), phone:val('f_phone'), phone2:val('f_phone2'), email:val('f_email'), address:val('f_address'), landmark:val('f_landmark'), city:val('f_city'), state:val('f_state'), pincode:val('f_pincode'),
          amcName:val('f_amcName'), brand:val('f_brand'), model:val('f_model'), serialNo:val('f_serialNo'), underWarranty:val('f_warranty')==='yes', activationDate:val('f_activationDate'), expiryDate:val('f_expiryDate'), totalServices:val('f_totalServices'), source:val('f_source'), amcAmount:val('f_amcAmount'),
          lastService:val('f_lastService'), intervalMonths:val('f_interval'), notes:val('f_notes')});
        activeModal=null; render();
      } else if(activeModal.type==='editCustomer'){
        const name=val('f_name'); if(!name){ showToast('Naam zaroori hai'); return; }
        await updateCustomer(activeModal.data.id, {name, type:val('f_custType'), phone:val('f_phone'), phone2:val('f_phone2'), email:val('f_email'), address:val('f_address'), landmark:val('f_landmark'), city:val('f_city'), state:val('f_state'), pincode:val('f_pincode'),
          amcName:val('f_amcName'), brand:val('f_brand'), model:val('f_model'), serialNo:val('f_serialNo'), underWarranty:val('f_warranty')==='yes', activationDate:val('f_activationDate'), expiryDate:val('f_expiryDate'), totalServices:Number(val('f_totalServices'))||0, source:val('f_source'), amcAmount:Number(val('f_amcAmount'))||0,
          lastService:val('f_lastService'), intervalMonths:Number(val('f_interval'))||3, notes:val('f_notes')});
        activeModal=null; render();
      } else if(activeModal.type==='addStaff'){
        const name=val('f_name'), pin=val('f_pin');
        if(!name){ showToast('Naam zaroori hai'); return; }
        if(!pin || pin.length<4){ showToast('PIN kam se kam 4 digit ka rakhein'); return; }
        await addStaff({name, phone:val('f_phone'), email:val('f_staffEmail'), role:val('f_role'), pin});
        activeModal=null; render();
      } else if(activeModal.type==='addJob'){
        const title=val('f_title'); if(!title){ showToast('Job title zaroori hai'); return; }
        if(!jobCustSelectedId){ showToast('Customer list se select karein'); return; }
        await addJob({title, tag:val('f_tag'), amount:val('f_jobAmount'), checklist:val('f_checklist'), customerId:jobCustSelectedId, assignedTo:val('f_tech'), date:val('f_date'), notes:val('f_jnotes')});
        activeModal=null; jobCustQuery=''; jobCustSelectedId=''; render();
      } else if(activeModal.type==='resetPin'){
        const pin=val('f_resetpin'); if(!pin || pin.length<4){ showToast('PIN kam se kam 4 digit ka rakhein'); return; }
        await resetStaffPin(activeModal.data.id, pin); activeModal=null; render();
      } else if(activeModal.type==='completeJob'){
        const amount=val('f_amount'); const rating=val('f_rating'); const sigUrl=getSignatureDataUrl('sigCanvas'); const techSigUrl=getSignatureDataUrl('techSigCanvas');
        await completeJobWithAmount(activeModal.data.id, amount, rating, sigUrl, techSigUrl); activeModal=null; render();
      } else if(activeModal.type==='amcSign'){
        const sigUrl=getSignatureDataUrl('sigCanvas');
        if(!sigUrl){ showToast('Pehle sign karein'); return; }
        await saveAmcSignature(activeModal.data.id, sigUrl); activeModal=null; render();
      }
      }finally{ resetBtn(); }
    };
  }
}
function paintCustSuggest(){
  const box=document.getElementById('custSuggest'); if(!box) return;
  const sel=STATE.customers.find(c=>c.id===jobCustSelectedId); const q=jobCustQuery.trim().toLowerCase(); let h='';
  if(sel) h=`<div class="item-sub" style="margin:-8px 0 14px 0;">Selected: <b>${esc(sel.name)}</b> · ${esc(sel.phone||'')}${sel.address?' · '+esc(sel.address):''}</div>`;
  else if(q){ const m=STATE.customers.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)).slice(0,5); if(m.length) h='<div class="suggest-list">'+m.map(c=>`<div class="suggest-item" data-pickcust="${c.id}"><div class="n">${esc(c.name)}</div><div class="p">${esc(c.phone||'')}</div></div>`).join('')+'</div>'; }
  box.innerHTML=h;
  box.querySelectorAll('[data-pickcust]').forEach(el=>el.onclick=()=>{ const c=STATE.customers.find(x=>x.id===el.dataset.pickcust); jobCustSelectedId=c.id; jobCustQuery=''; document.getElementById('f_custSearch').value=c.name; paintCustSuggest(); });
}
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }

/* ============ Boot ============ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{ regs.forEach(reg=>reg.unregister()); }).catch(()=>{});
}
boot();
</script>
