<script>
/* ============ Backend config (Google Apps Script Web App URL) ============ */
/* ============ Firebase (main data) + Apps Script (email only) config ============ */
const DEFAULT_FIREBASE_CONFIG='{\"apiKey\":\"AIzaSyCY89nm41X9tADB5KSK8m6o5nl3nqVXr-g\",\"authDomain\":\"sheetaltrack.firebaseapp.com\",\"projectId\":\"sheetaltrack\",\"storageBucket\":\"sheetaltrack.firebasestorage.app\",\"messagingSenderId\":\"919097584832\",\"appId\":\"1:919097584832:web:54b380b1042a9e4ced5125\"}';
const DEFAULT_EMAIL_URL='https://script.google.com/macros/s/AKfycbxylRUmian1V_9bGSJ7NGLNAht4bpQzEIvOSzpuaVx28nkkvGhAVD3gGjM9d8RbogyXeA/exec';
function getFirebaseConfig(){
  try{ const raw=localStorage.getItem('sheetaltrack_firebase_config')||DEFAULT_FIREBASE_CONFIG; return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function setFirebaseConfig(cfg){ try{ localStorage.setItem('sheetaltrack_firebase_config', JSON.stringify(cfg)); }catch(e){} }
function clearFirebaseConfig(){ try{ localStorage.removeItem('sheetaltrack_firebase_config'); }catch(e){} }
function getEmailUrl(){ try{ return localStorage.getItem('sheetaltrack_email_url')||DEFAULT_EMAIL_URL||''; }catch(e){ return DEFAULT_EMAIL_URL||''; } }
function setEmailUrl(u){ try{ localStorage.setItem('sheetaltrack_email_url', u); }catch(e){} }

let firestoreDB=null;
function initFirestore(){
  const cfg=getFirebaseConfig(); if(!cfg) return false;
  try{
    if(!firebase.apps || firebase.apps.length===0){ firebase.initializeApp(cfg); }
    firestoreDB=firebase.firestore(); try{ firestoreDB.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
    return true;
  }catch(e){ console.error('firebase init failed', e); return false; }
}

/* ============ Auth gate (Firebase Anonymous Auth) ============
   Har device/browser is app se juda ek signed-in Firebase user banta hai (anonymous — koi email/password nahi maangta).
   Isse Firestore security rules "request.auth != null" check laga sakte hain, taaki bina app kholе koi seedha
   Firestore API (curl/Postman se) data na padh sake. App ke andar ka role/PIN check pehle jaisa hi rehta hai. */
let AUTH_UID=null;
function waitForAuth(){
  return new Promise((resolve,reject)=>{
    let settled=false, unsub=null;
    const timer=setTimeout(()=>{ if(!settled){ settled=true; if(unsub) unsub(); reject(new Error('auth-timeout')); } },8000);
    unsub=firebase.auth().onAuthStateChanged(user=>{
      if(user && !settled){ settled=true; clearTimeout(timer); AUTH_UID=user.uid; if(unsub) unsub(); resolve(user.uid); }
    }, e=>{ if(!settled){ settled=true; clearTimeout(timer); if(unsub) unsub(); reject(e); } });
    firebase.auth().signInAnonymously().catch(e=>{ if(!settled){ settled=true; clearTimeout(timer); if(unsub) unsub(); reject(e); } });
  });
}
/* Login (PIN) verify hone ke baad ye batata hai Firestore rules ko ki is browser ka Firebase user kaun hai
   (role + staffId). Sirf isi mapping se admin-only data (KYC, audit) rules mein gate hoti hai. */
async function linkAuthUid(staffId, role, name){
  if(!AUTH_UID || !firestoreDB) return;
  try{ await firestoreDB.collection('st_authmap').doc(AUTH_UID).set({staffId, role, name:name||'', ts:Date.now()},{merge:true}); }
  catch(e){ console.error('authmap link failed', e); }
}

async function loadKeyRaw(key){
  if(!firestoreDB) throw new Error('not connected');
  const doc=await firestoreDB.collection('sheetaltrack_data').doc(key).get();
  cntDoc('doc:'+(/^photo_/.test(key)?'photo':key),doc);
  if(!doc.exists) return undefined;
  const data=doc.data();
  if(data.value===undefined || data.value===null || data.value==='') return undefined;
  return JSON.parse(data.value);
}
async function loadKey(key, fallback){
  for(let attempt=0; attempt<3; attempt++){
    try{
      const v=await loadKeyRaw(key);
      return v===undefined ? fallback : v;
    }catch(e){
      console.error('load failed (attempt '+(attempt+1)+')', key, e);
      if(attempt<2) await new Promise(r=>setTimeout(r, 500*(attempt+1)));
    }
  }
  throw new Error('load-failed:'+key);
}
/* ===== v7.2: Firebase reads kam karna + counter ===== */
const READS={srv:{},cache:{},since:Date.now()}, LAZY={};
function cntReads(name,snap){ try{ const n=(snap.docChanges?snap.docChanges().length:(snap.size||0)), fc=!!(snap.metadata&&snap.metadata.fromCache), b=fc?READS.cache:READS.srv; b[name]=(b[name]||0)+n; }catch(e){} }
function cntDoc(name,doc){ try{ const fc=!!(doc.metadata&&doc.metadata.fromCache), b=fc?READS.cache:READS.srv; b[name]=(b[name]||0)+1; }catch(e){} }
function readsCardHtml(){
  const srv=Object.keys(READS.srv).sort((a,b)=>READS.srv[b]-READS.srv[a]), tot=srv.reduce((t,k)=>t+READS.srv[k],0), cache=Object.values(READS.cache).reduce((t,v)=>t+v,0);
  return `<div class="section-title" style="margin-top:20px;">📊 Firebase Reads (is phone/browser par)</div><div class="card"><div class="item-sub" style="margin-bottom:6px;">App kholne ke baad se is device ne server se <b>${tot}</b> records padhe (free limit poore project ke liye 50,000 per din hai, sab phones milake). Cache se bina paise ke: ${cache}.</div>${srv.length?srv.map(k=>`<div class="row-between" style="padding:3px 0;"><div class="item-sub" style="margin:0;">${esc(k)}</div><div class="item-sub" style="margin:0;"><b>${READS.srv[k]}</b></div></div>`).join(''):'<div class="item-sub">Abhi koi server read nahi hua.</div>'}<div class="item-sub" style="margin-top:8px;">Tip: app band karke dobara kholein aur yahan dekhein — ek baar kholne ka kharcha dikhega.</div></div>`;
}
const COLL={st_bills:'st_bills',st_leads:'st_leads',st_travel:'st_travel',st_leave:'st_leave',st_media:'st_media',st_staff:'st_staff',st_customers:'st_customers',st_jobs:'st_jobs'};
const MAPK={st_locations:'st_loc',st_attendance:'st_att'};
const SYNCED={}; let PENDING=0;
function auditLog(staffId,name,role,type,detail){ try{ if(!firestoreDB) return; firestoreDB.collection('st_audit').add({staffId,name,role,type,detail:detail||'',ts:Date.now()}).catch(()=>{}); }catch(e){} }
async function loadAudit(staffId){

async function saveKey(key, value){
  if(!firestoreDB) return false;
  try{
    const db=firestoreDB, S=SYNCED[key]||(SYNCED[key]=new Map());
    if(COLL[key]){
      const ids=new Set();
      value.forEach(r=>{ if(!r||!r.id) return; ids.add(r.id); const js=JSON.stringify(r); if(S.get(r.id)!==js){ const pj=S.get(r.id); S.set(r.id,js); if(key==='st_jobs'||key==='st_leave') notifyChange(key,pj?JSON.parse(pj):null,JSON.parse(js)); track(db.collection(COLL[key]).doc(r.id).set(Object.assign(JSON.parse(js),{deleted:false}),{merge:true})); } });
      [...S.keys()].forEach(id=>{ if(!ids.has(id)){ S.delete(id); track(db.collection(COLL[key]).doc(id).set({deleted:true,deletedAt:Date.now()},{merge:true})); } });
    } else if(MAPK[key]){
      Object.keys(value||{}).forEach(k=>{ const js=JSON.stringify(value[k]); if(S.get(k)!==js){ S.set(k,js); const o=JSON.parse(js); track(db.collection(MAPK[key]).doc(k).set(key==='st_attendance'?{dates:o}:o,{merge:true})); } });
    } else { track(db.collection('sheetaltrack_data').doc(key).set({value: JSON.stringify(value)})); }
    return true;
  }catch(e){ console.error('save failed',key,e); showToast('⚠️ Save nahi hua'); return false; }
}

async function sendAdminOtp(){
  const admin=(STATE.staff||[]).find(s=>s.role==='admin'); if(!admin||!emailRecoveryReady()){ loginError='Email recovery set nahi hai'; render(); return; }
  const lock=otpLockLeft(); if(lock>0){ loginError='Zyada galat try — '+Math.ceil(lock/60000)+' minute baad dobara try karein'; render(); return; }
  if(forgotOtp&&Date.now()-forgotOtp.at<30000){ loginError='Thoda ruk kar dobara bhejein (30 second)'; render(); return; }

  const code=String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));
  forgotOtp={code,exp:Date.now()+10*60000,tries:0,at:Date.now(),sent:false}; loginError=''; showToast('OTP bheja ja raha hai…');
  try{ await sendEmailJs(admin.recoveryEmail,{otp:code,app_name:(STATE.businessInfo&&STATE.businessInfo.name)||'SheetalTrack',valid_min:10}); forgotOtp.sent=true; hr.push(Date.now()); otpLsSet('st_otp_sends',hr); showToast('📧 OTP '+maskEmail(admin.recoveryEmail)+' par bhej diya'); }

  render();

/* ===== TOTAL BACKUP (v7.6): har collection ka poora data — staff, customers, jobs, leads (call remarks, sheet links), bills, photos+videos, KYC, attendance, location, travel, chhutti, notifications, login log, settings, signatures ===== */
const FULL_COLLS=['sheetaltrack_data','st_staff','st_customers','st_jobs','st_leads','st_bills','st_travel','st_leave','st_att','st_loc','st_trail','st_kyc','st_notif','st_audit','st_media','st_mchunk'];
const FULL_LABEL={sheetaltrack_data:'Settings/Signatures',st_staff:'Staff',st_customers:'Customers',st_jobs:'Jobs',st_leads:'Leads',st_bills:'Bills',st_travel:'Travel',st_leave:'Chhutti',st_att:'Attendance',st_loc:'Location',st_trail:'Location trail',st_kyc:'KYC',st_notif:'Notifications',st_audit:'Login/Activity log',st_media:'Photos/Videos',st_mchunk:'Video/Resume data'};
async function exportData(){
  if(!firestoreDB){ showToast('Server se connect nahi hai'); return; }
  showToast('Total backup shuru… (bada data ho to 1-2 minute lag sakte hain)');
  const parts=['{"format":"sheetaltrack-full-v2","app":"SheetalTrack","exportedAt":'+JSON.stringify(new Date().toISOString())+',"collections":{'], counts={}; let first=true, failed=[];
  for(const name of FULL_COLLS){
    try{
      showToast('Backup: '+(FULL_LABEL[name]||name)+'…');
      const snap=await firestoreDB.collection(name).get(), obj={}; let n=0; snap.forEach(d=>{ obj[d.id]=d.data(); n++; });
      counts[name]=n; parts.push((first?'':',')+JSON.stringify(name)+':'+JSON.stringify(obj)); first=false;
    }catch(e){ console.error('backup fail',name,e); failed.push(name); }
  }
  parts.push('},"counts":'+JSON.stringify(counts)+',"failed":'+JSON.stringify(failed)+'}');
  if(failed.length&&!confirm('⚠️ Ye hisse backup mein nahi aa paye: '+failed.map(x=>FULL_LABEL[x]||x).join(', ')+'.\n\nPhir bhi file download karein?')) return;
  const blob=new Blob(parts,{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='sheetaltrack-TOTAL-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),60000);
  markBackup(); auditLog(STATE.session.staffId,STATE.session.name,STATE.session.role,'export','Total Backup'); showToast('Total backup download ho gaya ✅ ('+(counts.st_customers||0)+' customers, '+(counts.st_leads||0)+' leads, '+(counts.st_staff||0)+' staff)');
}
async function importData(file){ if(!confirm('Restore maujooda data par backup ka data wapas likh dega. Pehle naya Backup Download kar liya? Aage badhein?')) return;
  try{
    const text=await file.text(); const data=JSON.parse(text);
    if(data.format==='sheetaltrack-full-v2'&&data.collections){
      const C=data.collections, cnt=Object.keys(C).map(k=>(FULL_LABEL[k]||k)+': '+Object.keys(C[k]).length).join('\n');
      if(!confirm('Is backup mein ye hai:\n\n'+cnt+'\n\nSab wapas daalna hai?')) return;
      window.NOTIF_MUTE=true; const db=firestoreDB; let batch=db.batch(), ops=0, bytes=0, done=0, total=0;
      Object.keys(C).forEach(k=>{ total+=Object.keys(C[k]).length; });
      const flush=async()=>{ if(ops){ await batch.commit(); batch=db.batch(); ops=0; bytes=0; } };
      for(const name of Object.keys(C)){
        if(name==='st_authmap') continue;
        for(const id of Object.keys(C[name])){
          const d=C[name][id], sz=JSON.stringify(d).length;
          if(ops>=400||bytes+sz>7e6) await flush();
          batch.set(db.collection(name).doc(id),d); ops++; bytes+=sz; done++;
          if(done%200===0) showToast('Restore ho raha hai… '+done+'/'+total);
        }
      }
      await flush(); showToast('Restore ho gaya ✅ — app dobara khul rahi hai'); setTimeout(()=>location.reload(),1500); return;
    }
    if(!data.staff || !data.customers || !data.jobs){ showToast('Yeh file valid backup nahi hai'); return; }
    STATE.staff=data.staff; STATE.customers=data.customers; STATE.jobs=data.jobs;
    window.NOTIF_MUTE=true; setTimeout(()=>{ window.NOTIF_MUTE=false; },20000); STATE.locations=data.locations||{}; STATE.attendance=data.attendance||{};
    if(data.businessInfo) STATE.businessInfo=data.businessInfo;
    await Promise.all([saveKey(SKEY.STAFF,STATE.staff),saveKey(SKEY.CUSTOMERS,STATE.customers),saveKey(SKEY.JOBS,STATE.jobs),saveKey(SKEY.LOCATIONS,STATE.locations),saveKey(SKEY.ATTENDANCE,STATE.attendance),saveKey(SKEY.BUSINESS,STATE.businessInfo)]);
    if(data.leaves){ STATE.leaves=data.leaves; await saveKey('st_leave',STATE.leaves); }
    if(data.travelLogs){ STATE.travelLogs=data.travelLogs; await saveKey('st_travel',STATE.travelLogs); }
    if(data.bills&&STATE.billsOK!==false){ STATE.bills=data.bills; await saveKey(SKEY.BILLS,STATE.bills); }
    showToast('Data restore ho gaya'); render();
  }catch(e){ console.error(e); showToast('File read nahi ho payi — sahi backup file select karein'); }
}

/* Ek number = ek profile: same phone wale customers ke group */
const phoneOk=p=>{ const d=String(p||'').replace(/\D/g,''); return d===''||d.length===10||(d.length===11&&d[0]==='0')||(d.length===12&&d.slice(0,2)==='91'); };
function dupCustomerGroups(){
  const cs=(STATE.customers||[]).filter(c=>!c.deleted);
  const parent=new Map(cs.map(c=>[c.id,c.id])); const find=x=>{ while(parent.get(x)!==x){ parent.set(x,parent.get(parent.get(x))); x=parent.get(x); } return x; };
  const byPh=new Map();
  cs.forEach(c=>[ph10(c.phone),ph10(c.phone2)].forEach(p=>{ if(p.length!==10) return; if(byPh.has(p)){ parent.set(find(c.id),find(byPh.get(p))); } else byPh.set(p,c.id); }));
  const g=new Map(); cs.forEach(c=>{ const r=find(c.id); if(!g.has(r)) g.set(r,[]); g.get(r).push(c); });
  return [...g.values()].filter(a=>a.length>1);
}
function dupPickPrimary(arr){
  const score=c=>((c.type||'amc')==='amc'?1000:0)+(Number(c.servicesDone)||0)*5+((c.amcHistory||[]).length*20)+(c.activationDate?10:0)+(Number(c.amcAmount)>0?10:0)+(STATE.jobs||[]).filter(j=>j.customerId===c.id).length;
  return arr.slice().sort((a,b)=>score(b)-score(a)||(a.createdAt||0)-(b.createdAt||0))[0];
}
function mergeCustGroupInMemory(arr,primaryId){
  const p=(primaryId&&arr.find(x=>x.id===primaryId))||dupPickPrimary(arr), ids=new Set();
  arr.forEach(d=>{
    if(d.id===p.id) return; ids.add(d.id);
    Object.keys(d).forEach(k=>{ if(['id','createdAt','deleted','amcHistory','serviceLog','servicesDone','notes','type'].indexOf(k)>-1) return; const v=d[k]; if((p[k]===undefined||p[k]===''||p[k]===null||p[k]===0)&&v!==undefined&&v!==''&&v!==null) p[k]=v; });
    { const dp=ph10(d.phone), pp=ph10(p.phone), p2=ph10(p.phone2); if(dp.length===10&&dp!==pp&&dp!==p2&&!p.phone2) p.phone2=d.phone; }
    if(d.notes&&String(p.notes||'').indexOf(d.notes)<0) p.notes=(p.notes?p.notes+'\n':'')+d.notes;
    if(!(p.amcHistory&&p.amcHistory.length)&&d.amcHistory&&d.amcHistory.length) p.amcHistory=d.amcHistory;
    if(!(p.serviceLog&&p.serviceLog.length)&&d.serviceLog&&d.serviceLog.length){ p.serviceLog=d.serviceLog; p.servicesDone=Math.max(Number(p.servicesDone)||0,Number(d.servicesDone)||0); }
    if((p.type||'amc')!=='amc'&&(d.type||'amc')==='amc') p.type='amc';
  });
  (STATE.jobs||[]).forEach(j=>{ if(ids.has(j.customerId)) j.customerId=p.id; });
  (STATE.bills||[]).forEach(b=>{ if(ids.has(b.customerId)) b.customerId=p.id; });
  (STATE.leads||[]).forEach(l=>{ if(ids.has(l.doneCustId)) l.doneCustId=p.id; });
  STATE.customers=STATE.customers.filter(c=>!ids.has(c.id));
  return {p,removed:ids.size};
}

/* ===== Naam + Area se pehchan (jinke paas number nahi / alag profile) ===== */
function nameKey(n){ return String(n||'').toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,''); }
function addrTokens(c){ return String(c.address||'').toLowerCase().split(/[^a-z0-9\u0900-\u097f]+/).filter(t=>t.length>=3&&!/^(road|marg|nagar|flat|room|near|opp|building|bldg|society|east|west|mira|thane|mumbai|the)$/.test(t)); }
function addrOverlap(a,b){ const A=addrTokens(a), B=new Set(addrTokens(b)); if(!A.length||!B.size) return null; return A.some(t=>B.has(t)); }
function samePersonCandidates(c,list){
  const k=nameKey(c.name); if(k.length<3) return [];
  const mine=ph10(c.phone);
  return (list||STATE.customers||[]).filter(o=>{ if(o.id===c.id||o.deleted||nameKey(o.name)!==k) return false;
    const op=ph10(o.phone); if(op.length===10&&mine.length===10&&op!==mine&&ph10(o.phone2)!==mine&&ph10(c.phone2)!==op) return false; /* dono ke alag-alag number = alag log */
    const ov=addrOverlap(c,o); if(ov===false&&op.length===10&&mine.length===10) return false; return true; });
}
function nameMergeGroups(){
  const cs=(STATE.customers||[]).filter(c=>!c.deleted), by=new Map();
  cs.forEach(c=>{ const k=nameKey(c.name); if(k.length<3) return; if(!by.has(k)) by.set(k,[]); by.get(k).push(c); });
  const out=[];
  by.forEach(arr=>{ if(arr.length<2) return;
    const phones=new Set(); arr.forEach(c=>[ph10(c.phone),ph10(c.phone2)].forEach(p=>{ if(p.length===10) phones.add(p); }));
    const withPh=arr.filter(c=>ph10(c.phone).length===10||ph10(c.phone2).length===10);
    /* alag-alag number wale log = alag; isliye sirf wahi group jahan 1 se zyada alag number na ho, ya kam se kam ek profile bina number ka ho */
    if(phones.size>2) return; if(withPh.length>1&&phones.size>1&&!arr.some(c=>ph10(c.phone).length!==10)) return;
    let strong=true; for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){ if(addrOverlap(arr[i],arr[j])===false) strong=false; }
    out.push({key:nameKey(arr[0].name),arr,strong}); });
  return out.sort((a,b)=>(b.strong?1:0)-(a.strong?1:0)||a.arr[0].name.localeCompare(b.arr[0].name));
}
async function mergeNameGroups(keys){
  const gs=nameMergeGroups().filter(g=>keys.indexOf(g.key)>-1); let removed=0;

/* ============ Customer import (Excel/CSV) — smart header detection ============ */
function parseCsvLine(line){
  const out=[]; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ inQuotes=!inQuotes; }
    else if(ch===',' && !inQuotes){ out.push(cur); cur=''; }
    else{ cur+=ch; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function findCol(headers, candidates){
  for(const cand of candidates){
    const idx=headers.findIndex(h=>h.includes(cand));
    if(idx!==-1) return idx;
  }
  return -1;
}
function findHeaderRowIndex(rows){
  const keywords=['name','naam','customer','phone','contact','mobile','address','date','brand','model','amount','amt','year','serial','card'];
  let bestIdx=0, bestScore=-1;
  for(let i=0;i<Math.min(15, rows.length);i++){
    const rowLower=(rows[i]||[]).map(c=>String(c||'').toLowerCase().trim());
    const nonEmpty=rowLower.filter(c=>c!=='').length;
    if(nonEmpty<2) continue;
    let score=0;
    rowLower.forEach(cell=>{ if(keywords.some(k=>cell.includes(k))) score++; });
    if(score>bestScore){ bestScore=score; bestIdx=i; }
  }
  return bestScore>=2 ? bestIdx : 0;
}
function parseAnyDate(s){
  if(!s) return '';
  const t=String(s).trim();
  if(!t) return '';
  if(/^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/.test(t)){ const r=dmyParse(t,1950); if(r) return r; }
  const d=new Date(t);
  if(!isNaN(d.getTime()) && d.getFullYear()>1950) return d.toISOString().slice(0,10);
  const m=t.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [_,a,b,y]=m; if(y.length===2) y='20'+y;
    const d2=new Date(Number(y), Number(b)-1, Number(a));
    if(!isNaN(d2.getTime())) return d2.toISOString().slice(0,10);
  }
  return '';
}
async function processCustomerRows(rows){
  if(rows.length<2){ showToast('File mein data nahi mila'); return; }
  const headerRowIdx=findHeaderRowIndex(rows);
  const headers=rows[headerRowIdx].map(s=>String(s).toLowerCase().trim());
  const colName=findCol(headers,['customer name','naam','name','customer']);
  const colPhone=findCol(headers,['mobile no','contact no','phone','mobile','number']);
  const colPhone2=findCol(headers,['residential tel','tel no','telephone','landline']);
  const colAddress1=findCol(headers,['address1','address 1','address']);
  const colAddress2=findCol(headers,['address2','address 2']);
  const colAddress3=findCol(headers,['address3','address 3']);
  const colArea=findCol(headers,['area']);
  const colDate=findCol(headers,['date']);
  const colEndDate=findCol(headers,['end date','expiry']);
  const colYear=findCol(headers,['year']);
  const colProduct=findCol(headers,['product']);
  const colBrand=findCol(headers,['brand']);
  const colModel=findCol(headers,['model']);
  const colSerial=findCol(headers,['serial','card no']);
  const colAmt=findCol(headers,['amt','amount']);
  const colTech=findCol(headers,['tecnician','technician','telly caller','caller']);
  const colWarranty=findCol(headers,['warranty']);
  const colEmail=findCol(headers,['email','e-mail']);
  const colNotes=findCol(headers,['notes','description']);
  if(colName===-1){ showToast('Customer naam wala column nahi mila'); return; }
  let added=0, skipped=0, dupSkipped=0;
  for(let i=headerRowIdx+1;i<rows.length;i++){
    const cols=rows[i];
    const name=(cols[colName]||'').trim();
    if(!name){ skipped++; continue; }
    const phoneRaw=(colPhone>-1?(cols[colPhone]||''):'').replace(/[^0-9\/,]/g,'');
    const phoneParts=phoneRaw.split(/[\/,]/).map(s=>s.trim()).filter(Boolean);
    const phone=phoneParts[0]||''; let phone2=phoneParts[1]||'';
    if(!phone2 && colPhone2>-1){ phone2=(cols[colPhone2]||'').replace(/[^0-9]/g,'').trim(); }
    const addrParts=[colAddress1,colAddress2,colAddress3].map(ci=>ci>-1?(cols[ci]||'').trim():'').filter(Boolean);
    let address=addrParts.join(', ');
    const area=(colArea>-1?(cols[colArea]||''):'').trim();
    if(area) address=address?address+', '+area:area;
    let activationDate=colDate>-1?parseAnyDate(cols[colDate]):'';
    if(!activationDate) activationDate=todayStr();
    let expiryDate=colEndDate>-1?parseAnyDate(cols[colEndDate]):'';
    let totalServices=0;
    if(colYear>-1){ const ym=(cols[colYear]||'').match(/(\d+)/); if(ym) totalServices=Number(ym[1])*4; }
    if(!expiryDate && totalServices) expiryDate=addMonths(activationDate,12);
    const productVal=colProduct>-1?(cols[colProduct]||''):'';
    const isAmcLike = colBrand>-1 || colProduct>-1 || colEndDate>-1 || colYear>-1;
    if(dupCustomerByPhone(phone,phone2)){ dupSkipped++; continue; }
    STATE.customers.push({id:uid(), name, type:isAmcLike?'amc':'onetime', phone, phone2, email:colEmail>-1?(cols[colEmail]||''):'', address, landmark:'', city:'', state:'', pincode:'',
      lastService:activationDate, intervalMonths:3,
      amcName:isAmcLike?name+' AMC':'', brand:colBrand>-1?(cols[colBrand]||''):productVal, model:colModel>-1?(cols[colModel]||''):'', serialNo:colSerial>-1?(cols[colSerial]||''):'',
      underWarranty:colWarranty>-1?/yes/i.test(cols[colWarranty]||''):false, activationDate:isAmcLike?activationDate:'', expiryDate, totalServices, servicesDone:0,
      source:colTech>-1?(cols[colTech]||''):'', amcAmount:colAmt>-1?(Number(String(cols[colAmt]).replace(/[^0-9.]/g,''))||0):0,
      leadStatus:'new', notes:colNotes>-1?(cols[colNotes]||''):''});
    added++;
  }
  if(added===0){ showToast(dupSkipped?('Sab '+dupSkipped+' number pehle se app mein hain — naya kuch nahi jura'):'Koi valid customer row nahi mila'); return; }
  await saveKey(SKEY.CUSTOMERS, STATE.customers);
  showToast(added+' customers import ho gaye'+(skipped?' ('+skipped+' khaali rows skip hui)':'')+(dupSkipped?' · '+dupSkipped+' same number wale pehle se hain, skip':'')); render();
}
async function importCustomersCsv(file){
  try{
    const text=await file.text();

function leadHeaderMatch(h,keys){ h=String(h||'').toLowerCase().replace(/[^a-z0-9]/g,''); return keys.some(k=>h.includes(k)); }
function findLeadHeaderIdx(rows){
  let best=0, bestScore=-1;
  for(let i=0;i<Math.min(12,rows.length);i++){
    const h=rows[i]||[]; let sc=0;
    if(h.some(c=>leadHeaderMatch(c,['customer']))) sc++;
    if(h.some(c=>leadHeaderMatch(c,['mobile','mobno']))) sc++;
    if(h.some(c=>leadHeaderMatch(c,['product']))) sc++;
    if(h.some(c=>leadHeaderMatch(c,['date','purchase','khareed']))) sc++;
    if(sc>bestScore){ best=i; bestScore=sc; }
  }
  return bestScore>=2?best:0;
}
function isoDate(y,m,d){ const dt=new Date(Date.UTC(y,m-1,d)); if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d) return null; return dt.toISOString().slice(0,10); }
function leadDateCandidates(raw){
  const t=String(raw||'').trim(); if(!t) return [];
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){ const v=isoDate(+m[1],+m[2],+m[3]); return v?[v]:[]; }
  m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(!m) return [];
  const a=+m[1], b=+m[2]; let y=+m[3]; if(y<100) y+=2000;
  const out=[]; const dm=isoDate(y,b,a), md=isoDate(y,a,b);
  if(dm) out.push(dm); if(md&&md!==dm) out.push(md);
  return out;
}
/* Sheet mein kuch dates D/M/Y aur kuch M/D/Y mein hoti hain (jaise 5/1/2025 aur 6/5/2025).
   Sheet ki dates lagbhag order mein hoti hain, isliye har row ke liye wo mahina-din chunte hain jo
   pichli row ki date ke sabse nazdeek ho — isse poori sheet ek sahi sequence mein aa jaati hai. */
function resolveLeadDates(rawList){
  const out=rawList.map(x=>String(x||'').trim().slice(0,10)), cands=rawList.map(leadDateCandidates);
  const idx=[]; cands.forEach((c,i)=>{ if(c.length) idx.push(i); });
  if(!idx.length) return out;
  const day=v=>Date.parse(v)/86400000, table=[];
  idx.forEach((ri,t)=>{
    const cs=cands[ri];
    table.push(cs.map(c=>{
      if(t===0) return {cost:0,from:-1};
      let best=Infinity, from=0;
      table[t-1].forEach((pv,j)=>{ const cst=pv.cost+Math.abs(day(c)-day(cands[idx[t-1]][j])); if(cst<best){ best=cst; from=j; } });
      return {cost:best,from};
    }));
  });
  let k=0, bc=Infinity; table[table.length-1].forEach((pv,j)=>{ if(pv.cost<bc){ bc=pv.cost; k=j; } });
  for(let t=table.length-1;t>=0;t--){ out[idx[t]]=cands[idx[t]][k]; k=table[t][k].from; }
  return out;
}
function normalizeSheetUrl(u){
  u=String(u||'').trim();
  if(/\/pubhtml/.test(u)) u=u.replace(/\/pubhtml/,'/pub');
  if(/\/pub(\?|$)/.test(u) && !/output=csv/.test(u)) u+=(u.includes('?')?'&':'?')+'output=csv';
  return u;
}
/* v4.7: sheet ke remark columns (K-N) se: ONLINE/CASH = AMC ho chuki (payment mili); CB / LATER / BAAD ME = baad mein call (follow-up).
   Follow-up date agar remark mein aage ki mili to wahi, warna aaj (taaki turant list mein aaye). */
function readSheetRemarks(remarks){
  const t=remarks.join(' | '), pm=t.match(/\b(online|cash|cheque|upi)\b/i);
  const amcPay=pm?(pm[1][0].toUpperCase()+pm[1].slice(1).toLowerCase()):'';
  const wantsLater=!amcPay && /(\bcb\b|\blater\b|baad\s*me(in)?\b|call\s*back)/i.test(t.replace(/own\s*cb/gi,''));
  let fu='';
  if(wantsLater){
    fu=todayStr();
    for(const m of t.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/g)){ let y=+m[3]; if(y<100) y+=2000; const d=isoDate(y,+m[2],+m[1]); if(d&&d>fu) fu=d; }
  }
  return {amcPay, followUpDate:fu};
}
function rowsToLeads(rows, staffId, staffName, importedBy){
  const hi=findLeadHeaderIdx(rows), head=rows[hi]||[]; const col=keys=>head.findIndex(h=>leadHeaderMatch(h,keys));
  const cDate=col(['date','purchase','khareed']), cCust=col(['customer','name']), cProd=col(['product']), cA1=col(['address1','addr1']), cA2=col(['address2','addr2']), cA3=col(['address3','addr3']), cArea=col(['area']), cMob=col(['mobile','mobileno','mobno']), cRes=col(['residential','resedential','restel','landline','telno']);
  /* Column A (before "Date") pehle se telecaller ke apne excel mein TRUE/FALSE checkbox hoti hai (already-done-hai marker),
     aur "Resedential Tel No" ke baad ki extra columns mein purani call ke notes hote hain (jaise "NII 27/7/26", "RING 23/8/26") —
     dono ko preserve karte hain taaki telecaller ki purani mehnat/AMC history import karte waqt kho na jaye. */
  const known=new Set([cDate,cCust,cProd,cA1,cA2,cA3,cArea,cMob,cRes].filter(i=>i>-1));
  const chkCol=known.has(0)?-1:0;
  const body=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; const cust=cCust>-1?String(r[cCust]||'').trim():'', mob=cMob>-1?String(r[cMob]||'').replace(/\s+/g,''):''; if(!cust&&!mob) continue; body.push(r); }
  const dates=resolveLeadDates(body.map(r=>cDate>-1?r[cDate]:''));
  const g=(r,c)=>c>-1?String(r[c]==null?'':r[c]).trim():'';
  return body.map((r,k)=>{
    const remarks=[]; r.forEach((v,i)=>{ if(i===chkCol||known.has(i)) return; const t=String(v||'').trim(); if(t) remarks.push(t); });
    const sr=readSheetRemarks(remarks), preDone=(chkCol>-1 && /^true$/i.test(String(r[chkCol]||'').trim()))||!!sr.amcPay;
    return {id:uid(), purchaseDate:dates[k], customer:g(r,cCust), product:g(r,cProd), address1:g(r,cA1), address2:g(r,cA2), address3:g(r,cA3), area:g(r,cArea), mobile:g(r,cMob).replace(/\s+/g,''), resTel:g(r,cRes), assignedTo:staffId, assignedName:staffName,
      called:preDone, calledAt:preDone?Date.now():null, calledBy:preDone?'(Sheet se import)':'', preDone, remarks, remarkNote:preDone?(sr.amcPay?'Sheet mein '+sr.amcPay.toUpperCase()+' likha hai — AMC ho chuki lagti hai, review karein':'Sheet mein pehle se ✅ tha — pehle se AMC/deal ho chuka lagta hai, review karein'):'', amcPay:sr.amcPay, followUpDate:preDone?'':sr.followUpDate,
      dismissed:false, convertedJobId:null, importedBy, createdAt:Date.now()};
  });
}
let leadsUpdated=0;
function leadKey(l){ const m=(l.mobile||'').replace(/\D/g,'')||(l.resTel||'').replace(/\D/g,''); return l.assignedTo+'|'+(m||('n:'+(l.customer||'').trim().toLowerCase()))+'|'+(l.purchaseDate||''); }
/* v4.4: jo lead pehle se app mein hai use skip karne ki jagah update karte hain —
   sheet ka TRUE checkbox aur purane call notes purani (v4.3 se pehle import hui) leads mein bhi aa jayenge. */
function dedupeLeads(newLeads){
  const have=new Map((STATE.leads||[]).map(l=>[leadKey(l),l]));
  return newLeads.filter(l=>{
    const k=leadKey(l), ex=have.get(k);
    if(ex){
      if(l.preDone && !ex.called){ ex.called=true; ex.calledAt=Date.now(); ex.calledBy='(Sheet se import)'; ex.preDone=true; ex.remarkNote=l.remarkNote; leadsUpdated++; }
      if(l.followUpDate && !ex.called && !ex.followUpDate){ ex.followUpDate=l.followUpDate; leadsUpdated++; }
      if(l.amcPay && !ex.amcPay) ex.amcPay=l.amcPay;
      if(l.srcUrl && !ex.srcUrl) ex.srcUrl=l.srcUrl;
      const cur=ex.remarks||[], add=(l.remarks||[]).filter(r=>!cur.includes(r));
      if(add.length){ ex.remarks=cur.concat(add); if(!(l.preDone&&ex.preDone&&ex.calledBy==='(Sheet se import)')) leadsUpdated++; }
      return false;
    }
    have.set(k,l); return true;
  });
}

/* ===== AMC Import (purani contract sheet): ek customer ki saari renewal rows -> ek profile + poori AMC History ===== */
function dmyParse(v, minYear){
  if(v===null||v===undefined) return '';
  const lo=minYear||1990;
  if(v instanceof Date){ const y=v.getFullYear(); return (y>=lo&&y<=2100)?ymd(v):''; }
  const t=String(v).trim(); if(!t) return '';
  let y,m,d,mm;
  if((mm=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))){ y=+mm[1]; m=+mm[2]; d=+mm[3]; }
  else if((mm=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){ d=+mm[1]; m=+mm[2]; y=+mm[3]; if(y<100) y+=2000; if(m>12&&d<=12){ const x=d; d=m; m=x; } }
  else if(/^\d{5}(\.\d+)?$/.test(t)){ const n=Math.floor(+t); if(n>25000&&n<80000){ const dt=new Date(Date.UTC(1899,11,30)+n*86400000); y=dt.getUTCFullYear(); m=dt.getUTCMonth()+1; d=dt.getUTCDate(); } else return ''; }
  else { const dt=new Date(t); if(isNaN(dt.getTime())) return ''; y=dt.getFullYear(); m=dt.getMonth()+1; d=dt.getDate(); }
  if(y<lo||y>2100) return '';
  return isoDate(y,m,d)||'';
}
function findDateIn(s,minYear){ const t=String(s==null?'':s).trim(); if(!t) return ''; const m=t.match(/\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/); return m?dmyParse(m[0],minYear||2000):(/^\d{5}$/.test(t)?dmyParse(t,minYear||2000):''); }
function amcPhones(cell){ const out=[]; String(cell==null?'':cell).split(/[\/,;&\n]|\s{2,}/).forEach(tok=>{ const dg=tok.replace(/\D/g,''); if(dg.length>=20&&dg.length%10===0){ for(let i=0;i<dg.length;i+=10) out.push(dg.slice(i,i+10)); } else if(dg.length>=10) out.push(dg.slice(-10)); }); return [...new Set(out)]; }
function colLetter(n){ let s='',x=n+1; while(x>0){ const m=(x-1)%26; s=String.fromCharCode(65+m)+s; x=Math.floor((x-1)/26); } return s; }
const AI_FIELDS=[['start','Date (AMC shuru)',/^date$|^start|^from/i],['end','End Date',/end|expiry|upto/i],['purch','Purch = Install Date',/purch|install|^pur/i],['name','Customer Naam',/customer|^name|naam/i],['phone','Contact / Mobile',/cont|mobile|phone|mob/i],['address','Address',/address/i],['area','Area',/^area/i],['brand','Brand',/brand|^bra/i],['model','Model / Type',/model|^mo/i],['units','AC ki ginti (C)',/^c$|unit|qty|nos/i],['amount','Amount',/^amt|amount|^ai$|charge|rate/i],['teli','Telecaller (Teli)',/teli|caller/i],['years','Year',/year|yr|period/i],['tech','Technician',/^tec|tech/i],['desc','Description',/desc|note/i],['renewal','Renewal note',/renew/i],['status','Status (optional)',/^status/i]];
function amcGuessMap(H){ const map={}, used=new Set(); AI_FIELDS.forEach(([k,,re])=>{ const i=H.findIndex((h,ix)=>!used.has(ix)&&re.test(String(h||'').trim())); map[k]=i; if(i>-1) used.add(i); }); map.ser=H.map((h,i)=>/^ser/i.test(String(h||'').trim())?i:-1).filter(i=>i>-1); return map; }

function amcBuildPlan(d){
  const rows=d.rows, M=d.map, today=todayStr(), k10=v=>String(v||'').replace(/\D/g,'').slice(-10);
  const cell=(r,k)=>(M[k]>-1&&r[M[k]]!=null)?String(r[M[k]]).trim():'';
  const st={rows:0,noName:0,badStart:0,futureSvc:0,purch:0,badPurch:0,noPhone:0}, groups=new Map();
  for(let i=d.hdrIdx+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.some(c=>String(c||'').trim()!=='')) continue;
    const name=cell(r,'name'); if(!name){ st.noName++; continue; }
    st.rows++;
    const phones=amcPhones(cell(r,'phone')); if(!phones.length) st.noPhone++;
    const start=dmyParse(M.start>-1?r[M.start]:'',2000); if(!start) st.badStart++;
    let end=dmyParse(M.end>-1?r[M.end]:'',2000);
    const ym=cell(r,'years').match(/(\d+)/); let years=ym?Math.max(1,Math.min(5,+ym[1])):0;

    if(!years) years=1;
    const svc=[]; (M.ser||[]).forEach(ci=>{ const dt=findDateIn(r[ci],2000); if(dt){ if(dt>today) st.futureSvc++; else if(svc.indexOf(dt)<0) svc.push(dt); } }); svc.sort();
    const pr=cell(r,'purch'); let purch=pr?dmyParse(pr,1995):''; if(purch&&purch>today) purch=''; if(pr){ if(purch) st.purch++; else st.badPurch++; }
    const sv=cell(r,'status').toLowerCase(); let status='';
    if(sv){ if(/cancel|red|lapse|not\b|nahi|band|expire/.test(sv)) status='lapsed'; else if(/renew|green|done/.test(sv)) status='renewed'; else if(/active|current|chal/.test(sv)) status='active'; }
    const amount=Number(cell(r,'amount').replace(/[^0-9.]/g,''))||0, units=Number(cell(r,'units').replace(/[^0-9]/g,''))||0;
    const cyc={start,end,years,units,amount,services:svc,tech:cell(r,'tech'),teli:cell(r,'teli'),desc:cell(r,'desc'),renewalNote:cell(r,'renewal'),status,srcRow:i+1};
    const key=phones[0]||('n:'+name.toLowerCase().replace(/\s+/g,' ')+'|'+cell(r,'address').toLowerCase().slice(0,25));
    let g=groups.get(key); if(!g){ g={key,name,phones,address:'',area:'',brand:'',model:'',purch:'',cycles:[]}; groups.set(key,g); }
    g.cycles.push(cyc); g.name=name; if(phones.length) g.phones=phones;
    ['address','area','brand','model'].forEach(f=>{ const v=cell(r,f); if(v) g[f]=v; });
    if(purch&&(!g.purch||purch<g.purch)) g.purch=purch;
  }
  const have=new Set(), haveKey=new Set(); (STATE.customers||[]).forEach(c=>{ if(k10(c.phone)) have.add(k10(c.phone)); if(k10(c.phone2)) have.add(k10(c.phone2)); if(c.importKey) haveKey.add(c.importKey); });
  const out=[]; let newN=0, existN=0, cycles=0, renewals=0, svcN=0; const lastSt={active:0,expired:0,lapsed:0};
  groups.forEach(g=>{
    g.cycles.sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999'));
    g.cycles.forEach((c,i)=>{ const next=g.cycles[i+1];
      if(next){ if(c.status!=='lapsed'){ c.status='renewed'; c.renewedOn=next.start||''; } }
      else if(!c.status){ c.status=(c.end&&c.end>=today)?'active':'expired'; }
    });
    g.exists=g.phones.some(p=>have.has(p))||haveKey.has(g.key);
    if(g.exists){ existN++; } else { newN++; cycles+=g.cycles.length; renewals+=g.cycles.filter(c=>c.status==='renewed'&&c.renewedOn!==undefined).length; g.cycles.forEach(c=>{ svcN+=c.services.length; }); const l=g.cycles[g.cycles.length-1]; lastSt[l.status==='lapsed'?'lapsed':(l.status==='renewed'||(l.end&&l.end>=today))?'active':'expired']++; }
    out.push(g);

}

    if(j.status!=='done') return;

    const c=cmap.get(j.customerId), dt=j.completedAt?ymd(new Date(j.completedAt)):(j.date||'');

  });
  cs.forEach(c=>{

      h.forEach((x,i)=>{ const a=Number(x.amount)||0; if(!a||!x.start) return; const teli=String(x.teli||'').trim(), old=/^old/i.test(teli);
        rows.push({k:'amc',id:c.id+'#'+i,date:x.start,cat:i===0?(old?'amcold':'amcnew'):'renewal',amount:a,due:0,mode:normMode(x.mode),travel:0,custId:c.id,name:c.name,tech:'',title:i===0?'AMC':'AMC Renewal',teli:old?'':teli}); });
    } else {

      if(a>0&&d) rows.push({k:'amc',id:c.id+'#0',date:d,cat:c.isOld?'amcold':'amcnew',amount:a,due:0,mode:'',travel:0,custId:c.id,name:c.name,tech:'',title:'AMC',teli:c.isOld?'':String(c.leadTelecaller||((c.autoIncentive||c.sourceType==='telecaller')?c.incentiveTo:'')||'').trim()});
    }
  });
  (STATE.bills||[]).forEach(b=>{ if(!b.date) return;
    rows.push({k:'bill',id:b.id,date:b.date,cat:b.cat||classifyWork(b.work),amount:Number(b.amount)||0,due:Number(b.due)||0,mode:normMode(b.mode),travel:0,custId:b.customerId||'',name:b.name||'',phone:b.phone||'',tech:b.techName||'',title:b.work||'',teli:''}); });
  (STATE.travelLogs||[]).forEach(t=>{ const a=Number(t.amount)||0; if(a&&t.date) rows.push({k:'travel',id:t.id,date:t.date,cat:'travelonly',amount:0,due:0,mode:'',travel:a,custId:'',name:t.name||'',tech:t.staffId||'',title:'Travel',teli:''}); });
  rows.forEach(r=>{ if(r.phone===undefined){ const c=r.custId?cmap.get(r.custId):null; r.phone=c?(c.phone||''):''; } });
  return rows;
}
function moneyBounds(){
  const t=todayStr(), r=MONEY.range;

  if(r==='thism') return [t.slice(0,8)+'01',t];
  if(r==='m1') return [addMonths(t,-1),t];
  if(r==='m6') return [addMonths(t,-6),t];
  if(r==='y1') return [addMonths(t,-12),t];
  if(r==='custom') return [MONEY.from||'0000-01-01',MONEY.to||'9999-12-31'];

}

function billBuildPlan(d){
  const rows=d.rows, M=d.map, k10=v=>String(v||'').replace(/\D/g,'').slice(-10);
  const cell=(r,k)=>(M[k]>-1&&r[M[k]]!=null)?String(r[M[k]]).trim():'';
  const st={rows:0,blank:0,badDate:0,dup:0,link:0,newCust:0,nameOnly:0,anon:0,old:0,amt:0,due:0};
  const catN={}, modeN={cash:0,online:0,cheque:0,none:0};
  const phoneMap=new Map(); (STATE.customers||[]).forEach(c=>{ [c.phone,c.phone2].forEach(p=>{ const k=k10(p); if(k.length===10&&!phoneMap.has(k)) phoneMap.set(k,c); }); });
  const haveKeys=new Set((STATE.bills||[]).map(b=>b.importKey).filter(Boolean)), seen={};
  const items=[], newCust=new Map();
  for(let i=d.hdrIdx+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.some(c=>String(c||'').trim()!=='')) continue;
    const name=cell(r,'name'), amount=Number(cell(r,'amount').replace(/[^0-9.]/g,''))||0, phones=amcPhones(cell(r,'phone'));
    if(!name&&!phones.length&&!amount){ st.blank++; continue; }
    const date=dmyParse(M.date>-1?r[M.date]:'',2010); if(!date){ st.badDate++; continue; }
    st.rows++;
    const teli=cell(r,'teli'), old=/^old/i.test(teli), work=cell(r,'work'), desc=[cell(r,'desc'),cell(r,'desc2')].filter(Boolean).join(' · ');
    const mode=normMode(cell(r,'mode')), due=Number(cell(r,'due').replace(/[^0-9.]/g,''))||0;
    const base=[date,amount,phones[0]||'',name.toLowerCase().replace(/\s+/g,' '),work.toLowerCase()].join('|'); seen[base]=(seen[base]||0)+1; const key=base+'#'+seen[base];
    if(haveKeys.has(key)){ st.dup++; continue; }
    const cat=classifyWork(work+' '+desc);
    let kind='anon', custId='', ncKey='';
    const hit=phones.map(p=>phoneMap.get(p)).find(Boolean);
    if(hit){ kind='link'; custId=hit.id; st.link++; }
    else if(phones.length){ kind='new'; ncKey=phones[0]; st.newCust++; }
    else if(name){ kind='new'; ncKey='n:'+name.toLowerCase().replace(/\s+/g,' ')+'|'+String(cell(r,'address')||'').toLowerCase().slice(0,15); st.nameOnly++; }
    else { st.anon++; }
    if(old) st.old++;
    st.amt+=amount; st.due+=due; catN[cat]=(catN[cat]||0)+1; modeN[mode||'none']++;
    const it={key,date,name,phone:phones[0]||'',phone2:phones[1]||'',address:cell(r,'address'),area:cell(r,'area'),brand:cell(r,'brand'),model:cell(r,'model'),qty:Number(cell(r,'qty'))||1,mode,amount,due,cat,work,desc,techName:cell(r,'tech'),teli:old?'':teli,old,kind,custId,ncKey,srcRow:i+1};
    items.push(it);
    if(kind==='new'){ let g=newCust.get(ncKey); if(!g){ g={phone:phones[0]||'',phone2:phones[1]||'',name,address:'',area:'',brand:'',model:'',old:false,first:date,last:date}; newCust.set(ncKey,g); } g.name=name||g.name; if(it.address) g.address=it.address; if(it.area) g.area=it.area; if(it.brand) g.brand=it.brand; if(it.model) g.model=it.model; if(old) g.old=true; if(date<g.first) g.first=date; if(date>g.last) g.last=date; }
  }
  st.newCust=newCust.size;
  return {items,newCust,st,catN,modeN};
}

function numToWordsIN(n){
  n=Math.round(Number(n)||0); if(n<=0) return 'Zero Rupees';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'], b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const out=[]; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out.push(three(cr)+' Crore'); if(lk) out.push(two(lk)+' Lakh'); if(th) out.push(two(th)+' Thousand'); if(n) out.push(three(n));
  return out.join(' ')+' Rupees';
}

function billCollect(){
  const items=[]; let bad='';
  document.querySelectorAll('[data-blrow]').forEach(r=>{ const i=r.dataset.blrow, name=val('bl_n'+i).trim(), qty=Number(val('bl_q'+i))||0, rate=Number(val('bl_r'+i))||0; if(!name&&!qty&&!rate) return; if(!name){ bad='Item ka naam likhein'; return; } if(qty<=0){ bad='"'+name+'" ki Qty daalein'; return; } items.push({name,qty,unit:'QTY',rate,disc:0}); });
  const dt=val('bl_dt')||'amt', dv=Number(val('bl_dv'))||0, gstOn=!!(document.getElementById('bl_gst')&&document.getElementById('bl_gst').checked);
  const inv={items,kind:val('bl_kind')==='quotation'?'quotation':'invoice',extraDisc:dv>0?{type:dt,val:dv}:null,gst:{on:gstOn,pct:Number(val('bl_gp'))||18},billTo:{name:val('bl_name').trim(),address:val('bl_addr').trim(),phone:val('bl_phone').trim(),email:val('bl_email').trim()}};
  const T=invTotals(inv);
  if(!bad&&!items.length) bad='Kam se kam ek item likhein';
  if(!bad&&dv>0&&dt==='amt'&&dv>T.sub) bad='Discount total se zyada hai';
  if(!bad&&dv>0&&dt==='pct'&&dv>100) bad='Discount 100% se zyada nahi ho sakta';
  if(!bad&&!phoneOk(inv.billTo.phone)) bad='Mobile number 10 digit ka hona chahiye';
  if(!bad&&inv.billTo.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inv.billTo.email)) bad='Email sahi likhein';
  return {inv,T,bad};
}

const NOTIF={unsub:null,key:'',first:true,seen:new Set()};
const NOTIF_TTL=10*86400000, OFFICE_KEYS=['role:admin','role:subadmin'];
function nStaff(id){ const s=(STATE.staff||[]).find(x=>x.id===id); return s?s.name:''; }

function notifEnsure(){
  const me=STATE.session; if(!me||!firestoreDB) return;
  const key=me.staffId+'|'+me.role; if(NOTIF.key===key&&NOTIF.unsub) return;
  notifStop(); NOTIF.key=key; NOTIF.first=true; NOTIF.seen=new Set();
  try{
    NOTIF.unsub=firestoreDB.collection('st_notif').where('toKeys','array-contains-any',['staff:'+me.staffId,'role:'+me.role]).onSnapshot(snap=>{
      cntReads('st_notif',snap);
      const now=Date.now(), list=[];
      snap.forEach(d=>{ const r=d.data(); r.id=r.id||d.id;
        if(r.ts&&now-r.ts>NOTIF_TTL){ try{ d.ref.delete().catch(()=>{}); }catch(e){} return; }
        if(r.byId===me.staffId) return; list.push(r); });
      list.sort((a,b)=>b.ts-a.ts);
      const fresh=NOTIF.first?[]:list.filter(r=>!NOTIF.seen.has(r.id)&&!(r.readBy&&r.readBy[me.staffId]));
      list.forEach(r=>NOTIF.seen.add(r.id));
      NOTIF.first=false; STATE.notifs=list.slice(0,100); STATE.notifOK=true;
      if(fresh.length) notifAlert(fresh);

    },e=>{ console.error('notif listen',e); STATE.notifOK=false; bgRender(); });
  }catch(e){ STATE.notifOK=false; }

const MON_L=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmyPickHtml(pre,iso){
  const ok=/^\d{4}-\d{2}-\d{2}$/.test(iso||''), y0=ok?+iso.slice(0,4):0, m0=ok?+iso.slice(5,7):0, d0=ok?+iso.slice(8,10):0, cy=new Date().getFullYear();
  let lo=1995; if(ok&&y0<lo) lo=y0; let hi=cy+1; if(ok&&y0>hi) hi=y0;
  const o=(v,l,sel)=>`<option value="${v}" ${sel?'selected':''}>${l}</option>`;
  let d='',m='',y=''; d+=o('','Din',!d0); for(let i=1;i<=31;i++) d+=o(i,i,i===d0);
  m+=o('','Mahina',!m0); MON_L.forEach((n,i)=>{ m+=o(i+1,n,i+1===m0); });

function dmyVal(pre){

function bulkMatch(text, defDate){
  const k10=v=>String(v||'').replace(/\D/g,'').slice(-10);
  const all=STATE.leads||[], isClosed=l=>l.dismissed||l.convertedJobId||l.markedDone, open=all.filter(l=>!isClosed(l));
  const idx=new Map(), add=(k,l)=>{ if(k.length===10){ if(!idx.has(k)) idx.set(k,[]); const a=idx.get(k); if(a.indexOf(l)<0) a.push(l); } };
  open.forEach(l=>{ add(k10(l.mobile),l); add(k10(l.resTel),l); });
  const doneSet=new Set(); all.filter(isClosed).forEach(l=>{ doneSet.add(k10(l.mobile)); if(l.resTel) doneSet.add(k10(l.resTel)); });
  const seen=new Set(), seenLead=new Set(), matched=[], already=[], notFound=[], today=todayStr();
  String(text||'').split(/\r?\n/).forEach(raw=>{
    let line=raw.trim(); if(!line) return;
    let date=defDate||today; const dm=line.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(dm){ let y=+dm[3]; if(y<100) y+=2000; const d=isoDate(y,+dm[2],+dm[1]); if(d&&d<=today) date=d; line=line.replace(dm[0],' '); }
    const re=/(?:^|[^\d])(?:\+?91[\s-]*)?(\d{5}[\s-]?\d{5})(?!\d)/g; let m;
    while((m=re.exec(line))){
      const key=m[1].replace(/\D/g,''); if(seen.has(key)) continue; seen.add(key);
      const ls=idx.get(key);
      if(ls){ ls.forEach(l=>{ if(!seenLead.has(l.id)){ seenLead.add(l.id); matched.push({leadId:l.id,key,date}); } }); }
      else if(doneSet.has(key)) already.push(key); else notFound.push(key);
    }
  });
  return {matched,already,notFound};
}

function computeVisitGap(customerId, dateStr){
  const priorDates=STATE.jobs.filter(j=>j.customerId===customerId && j.status==='done' && j.completedAt).map(j=>ymd(new Date(j.completedAt))).filter(d=>d<dateStr).sort();
  const prior=priorDates[priorDates.length-1]; if(!prior) return {flag:null,days:null};
  const days=Math.round((new Date(dateStr)-new Date(prior))/86400000);
  if(days<=30) return {flag:'revisit',days};
  if(days<=90) return {flag:'repair',days};
  return {flag:null,days};
}

let sigDrawing=false; const sigHasDrawnMap={};
function initSignaturePad(canvasId){
  const canvas=document.getElementById(canvasId); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  sigHasDrawnMap[canvasId]=false;
  ctx.strokeStyle='#122327'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  function pos(e){
    const rect=canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height)};
  }
  function start(e){ e.preventDefault(); sigDrawing=true; sigHasDrawnMap[canvasId]=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!sigDrawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(e){ sigDrawing=false; }
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
function clearSignaturePad(canvasId){

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=480; const scale=Math.min(1, maxW/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.45));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

}

function bindLoginEvents(){
  document.querySelectorAll('.role-opt').forEach(b=>b.onclick=()=>{ loginRole=b.dataset.role; loginPin=''; loginError=''; loginSelectedStaff=null; forgotFlow=null; render(); });
  const pinInput=document.getElementById('pinInput'); if(pinInput) pinInput.oninput=(e)=>{ loginPin=e.target.value; };
  const staffSelect=document.getElementById('staffSelect'); if(staffSelect) staffSelect.onchange=(e)=>{ loginSelectedStaff=e.target.value; };
  const submitBtn=document.getElementById('loginSubmit');
  const doLoginSubmit=()=>{
    const pin=(document.getElementById('pinInput')||{}).value||'';
    if(loginRole==='admin'){ const recoveryA=(document.getElementById('recoveryAnswer')||{}).value||''; doAdminLogin(pin, recoveryA); }
    else{ const sel=(document.getElementById('staffSelect')||{}).value; if(!sel){ loginError='Pehle naam select karein'; render(); return; } doStaffLogin(sel, pin); }
  };
  if(submitBtn) submitBtn.onclick=doLoginSubmit;
  document.querySelectorAll('.login-wrap input').forEach(inp=>{
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); doLoginSubmit(); } };
  });
  const forgotBtn=document.getElementById('forgotBtn'); if(forgotBtn) forgotBtn.onclick=()=>{ forgotFlow='adminRecover'; forgotOtp=null; loginError=''; render(); };
  const cancelRecover=document.getElementById('cancelRecover'); if(cancelRecover) cancelRecover.onclick=()=>{ forgotFlow=null; loginError=''; render(); };
  const oS=document.getElementById('otpSend'); if(oS) oS.onclick=sendAdminOtp; const oR=document.getElementById('otpResend'); if(oR) oR.onclick=sendAdminOtp;
  const oV=document.getElementById('otpVerify'); const doOtp=()=>doAdminOtpReset((document.getElementById('otpInput')||{}).value||'',(document.getElementById('newPinInput')||{}).value||''); if(oV) oV.onclick=doOtp;
  const recoverySubmit=document.getElementById('recoverySubmit');
  const doRecoverySubmit=()=>{ const answer=(document.getElementById('recoveryAnswer')||{}).value||''; const newPin=(document.getElementById('newPinInput')||{}).value||''; doAdminRecovery(answer, newPin); };
  if(recoverySubmit) recoverySubmit.onclick=doRecoverySubmit;
}

/* ============ Dashboard ============ */
function jobInPeriod(job, period){
  if(period==='total') return true;
  const d=new Date(job.date);
  const now=new Date();
  if(period==='today') return job.date===todayStr();
  if(period==='week'){ const start=new Date(now); start.setDate(now.getDate()-7); return d>=start && d<=now; }
  if(period==='month'){ return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }
  if(period==='year'){ return d.getFullYear()===now.getFullYear(); }
  return true;
}
function inPeriodTs(ts, period){
  if(!ts) return false; if(period==='total') return true;
  const d=new Date(ts), now=new Date();
  if(period==='today') return ymd(d)===todayStr();
  if(period==='week'){ const start=new Date(now); start.setDate(now.getDate()-7); return d>=start && d<=now; }
  if(period==='month'){ return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }
  if(period==='year'){ return d.getFullYear()===now.getFullYear(); }
  return true;
}

function amcTimelineHtml(c){
  const tot=c.totalServices||0; if(!tot) return '';
  const log=(c.serviceLog||[]).sort((a,b)=>(a.visitNo||0)-(b.visitNo||0));
  const rows=[]; for(let n=1;n<=tot;n++){ const e=log.find(x=>x.visitNo===n); rows.push(e?`<div class="row-between" style="padding:4px 0;"><div class="item-sub">✅ Service ${n}</div><div class="item-sub">${fmtDate(new Date(e.date).toISOString().slice(0,10))}${e.by?' · '+esc(e.by):''}${e.note?' · 📝 '+esc(e.note):''}${e.manual?' · (manual)':''}${e.manual&&STATE.session.role!=='technician'?` <button class="mini-btn danger" style="padding:1px 7px;font-size:11px;" data-act="amcsvcdel" data-id="${c.id}" data-visit="${n}">✕</button>`:''}</div></div>`:`<div class="row-between" style="padding:4px 0;opacity:.6;"><div class="item-sub">○ Service ${n}</div><div class="item-sub">Baaki hai</div></div>`); }
  return `<details style="margin-bottom:8px;"><summary class="item-sub" style="cursor:pointer;font-weight:600;">📅 4 service kab-kab (poori list)</summary>${rows.join('')}</details>`;

async function saveRemark(id,due,o){
  if(!isMoneyRole()){ showToast('Ye sirf Admin / Office ke liye hai'); return false; }
  const c=STATE.customers.find(x=>x.id===id); if(!c) return false;
  const out=o.out; if(!REM_OUT[out]||out==='new'){ showToast('Call ka natija chunein'); return false; }
  let next=o.next||'';
  if(out==='later'&&!next){ showToast('Kab dobara call karna hai, wo date daalein'); return false; }
  if(out==='noans'&&!next) next=addDaysStr(todayStr(),1);
  if(next&&next<todayStr()){ showToast('Agla call aaj ya aage ki date ka rakhein'); return false; }
  if(out!=='later'&&out!=='noans') next='';

let AUDIO_CTX=null;
function audioUnlock(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!AUDIO_CTX) AUDIO_CTX=new AC(); if(AUDIO_CTX.state==='suspended') AUDIO_CTX.resume(); }catch(e){} }
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,audioUnlock,{passive:true}));
let DING_URL=null;
function dingWavUrl(){
  if(DING_URL) return DING_URL;
  try{ const sr=22050, n=Math.floor(sr*0.55), buf=new ArrayBuffer(44+n*2), v=new DataView(buf), w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){ const t=i/sr, f=t<0.25?880:1175, env=Math.exp(-6*(t<0.25?t:t-0.25)); v.setInt16(44+i*2,Math.round(Math.sin(2*Math.PI*f*t)*env*0.6*32767),true); }
    DING_URL=URL.createObjectURL(new Blob([buf],{type:'audio/wav'})); }catch(e){ DING_URL=''; }
  return DING_URL;
}
function playDing(){
  let ok=false;
  try{ audioUnlock(); const c=AUDIO_CTX; if(c&&c.state!=='closed'){ const now=c.currentTime; [[880,0],[1175,0.18]].forEach(([f,t])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.0001,now+t); g.gain.exponentialRampToValueAtTime(0.4,now+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.35); o.start(now+t); o.stop(now+t+0.38); }); ok=true; } }catch(e){}
  try{ const u=dingWavUrl(); if(u){ const a=new Audio(u); a.volume=1; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); ok=true; } }catch(e){}
  return ok;
}

function staffSummaryHtml(t){
  const td=todayStr(), mk=td.slice(0,7), mine=STATE.jobs.filter(j=>j.assignedTo===t.id), dOf=j=>j.completedAt?ymd(new Date(j.completedAt)):(j.date||'');
  const attDays=Object.keys((STATE.attendance||{})[t.id]||{}), att=attDays.filter(d=>d.startsWith(mk)).length, present=attDays.includes(td);
  const onLeave=isOnLeaveOn(t.id,td), loc=(STATE.locations||{})[t.id], live=loc&&(Date.now()-loc.ts)<10*60*1000;
  let h=`<div class="item-sub">📞 ${esc(t.phone||'—')} · ${esc(roleLabel(t.role))}</div>`;
  if(t.role==='technician'||t.role==='subadmin'){
    const today=mine.filter(j=>j.date===td&&j.status!=='rejected').length, open=mine.filter(jobIsOpen).length, mDone=mine.filter(j=>j.status==='done'&&dOf(j).startsWith(mk)).length, canc=mine.filter(j=>j.status==='rejected').length;
    if(t.role==='technician'||mine.length) h+=`<div class="item-sub">🛠 Aaj ki jobs: <b>${today}</b> · Baaki: <b>${open}</b> · Is mahine complete: <b>${mDone}</b> · Cancel: <b>${canc}</b></div>`;

  if(t.role==='technician') h+=`<div class="item-sub">📍 Location: <b>${live?'🟢 Live hai':(loc&&loc.ts?'Aakhri: '+fmtT(loc.ts):'—')}</b></div>`;

const MJ_TABS=[['today','📅 Aaj'],['next','🗓 Agle date'],['cancel','✖ Cancel'],['revisit','🔁 Revisit'],['done','✅ Complete']];
function myJobsFor(all,tab){
  const t=todayStr(), op=j=>j.status!=='done'&&j.status!=='rejected';
  if(tab==='today') return all.filter(j=>op(j)&&(j.date||'')<=t);
  if(tab==='next') return all.filter(j=>op(j)&&(j.date||'')>t);
  if(tab==='cancel') return all.filter(j=>j.status==='rejected'||(j.cancelReq&&j.cancelReq.status==='pending'));
  if(tab==='revisit') return all.filter(j=>(j.visitGap==='revisit'||j.visitGap==='repair')&&j.status!=='rejected');
  return all.filter(j=>j.status==='done');
}

function renderMyJobs(){
  const all=STATE.jobs.filter(j=>j.assignedTo===STATE.session.staffId);
  let tab=STATE.myJobsTab; if(!MJ_TABS.some(t=>t[0]===tab)) tab='today';
  const list=myJobsFor(all,tab);
  if(tab==='today'||tab==='next') list.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||((a.createdAt||0)-(b.createdAt||0)));
  else if(tab==='done') list.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  else list.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const cur=MJ_TABS.find(t=>t[0]===tab);
  return `<div class="tabbar">${MJ_TABS.map(t=>`<button class="tabbtn ${tab===t[0]?'active':''}" data-myjobtab="${t[0]}">${t[1]} (${myJobsFor(all,t[0]).length})</button>`).join('')}</div>
    <div class="section-title">${cur[1]} (${list.length})</div>
    ${list.length?`<div class="item-sub" style="margin:-4px 0 8px;">Job par tap karein — poori detail khulegi.</div>`:''}
    ${list.length===0?`<div class="empty-state"><span class="ic">🧾</span><p>${tab==='today'?'Aaj ke liye koi job baaki nahi hai.':'Yahan abhi koi job nahi hai.'}</p></div>`:list.map(myJobCard).join('')}`;
}

function kmBetween(a,b){ const R=6371, r=x=>x*Math.PI/180, dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]), h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function trailKm(p){ const ks=Object.keys(p||{}).sort((a,b)=>a-b); let km=0; for(let i=1;i<ks.length;i++){ const d=kmBetween(p[ks[i-1]],p[ks[i]]), dt=(ks[i]-ks[i-1])/3600; if(d<0.03) continue; if(dt>0&&d/dt>150) continue; km+=d; } return km; }
async function loadTravel(staffId){

    let month=0,today=0; const days={}; snap.forEach(d=>{ const x=d.data(), km=trailKm(x.p); month+=km; days[x.date]=km; if(x.date===todayStr()) today=km; });
    STATE.travel=STATE.travel||{}; STATE.travel[staffId]={today,month,days}; bgRender();

      <button class="primary-btn" id="modalSave">Mark Done</button>`;

  return `<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">${inner}</div></div>`;
}

        const iso=dmyVal('fx'); if(!iso){ showToast('Din, Mahina aur Saal teeno chunein'); return; }
        const okk=await moneyFixDate(activeModal.data,iso); if(!okk){ showToast('Entry nahi mili'); return; }
        activeModal=null; showToast('Date theek ho gayi'); render();
      } else if(activeModal.type==='remNote'){
        const r=await saveRemark(activeModal.data.id,(getAllDueCustomers().find(x=>x.id===activeModal.data.id)||{}).dueDate,{out:val('f_remOut'),note:val('f_remNote'),next:val('f_remNext')});
        if(r){ if(r==='booked'){ jobCustQuery=''; jobCustSelectedId=activeModal.data.id; activeModal={type:'addJob'}; } else { activeModal=null; } render(); }
      } else if(activeModal.type==='extraJob'){
        const ok=await saveExtra(activeModal.data.id,val('f_exDesc'),val('f_exAmt'),val('f_exNote')); if(ok){ activeModal=null; render(); }
      } else if(activeModal.type==='billMake'){
        const d=activeModal.data, bill=billCollect(); if(bill.bad){ showToast(bill.bad); resetBtn(); return; }
        let jid=d.id;
        if(!jid){ if(!d.customerId){ showToast('Customer nahi mila'); resetBtn(); return; } jid=await createBillJob(d.customerId,bill,val('f_billPay')); }
        else { const j=STATE.jobs.find(x=>x.id===jid), set=document.getElementById('f_billSetAmt'); if(!j){ showToast('Job nahi mili'); resetBtn(); return; }
          if(set&&set.checked&&bill.inv.kind!=='quotation'&&bill.T.grand!==Number(j.amount)){ j.amount=bill.T.grand; j.history=(j.history||[]).concat({s:'amount',t:Date.now(),by:(STATE.session&&STATE.session.name)||'',why:'Bill total se amount '+rupee(bill.T.grand)}); await saveKey(SKEY.JOBS,STATE.jobs); } }
        await finishBill(jid,bill.inv); activeModal={type:'billSend',data:{id:jid}}; render();
      } else if(activeModal.type==='invoiceEdit'){
        const ok=await saveInvoiceFromModal(activeModal.data); if(ok){ activeModal=null; render(); }
      } else if(activeModal.type==='dueRecv'){
        const ok=await receiveDue(activeModal.data.ref,val('f_dueAmt'),val('f_dueMode')); if(ok){ activeModal=null; render(); }
      } else if(activeModal.type==='amcRenew'){
        const ok=await renewAmc(activeModal.data.id,{start:val('f_rnStart'),years:val('f_rnYears'),amount:val('f_rnAmt'),mode:val('f_rnMode')}); if(ok){ activeModal=null; render(); }
      } else if(activeModal.type==='billLink'){
        const b=(STATE.bills||[]).find(x=>x.id===activeModal.data.id);
        if(b){ const ph=ph10(val('f_blPhone')); if(ph.length!==10){ showToast('10 digit ka mobile number daalein'); }
          else{ const nm=val('f_blName')||b.name; b.phone=ph; if(nm) b.name=nm; b.needsPhone=false; let c=dupCustomerByPhone(ph,'');
            if(!c){ await addCustomer({name:nm||'Customer',type:'onetime',phone:ph,address:[b.address,b.area].filter(Boolean).join(', '),brand:b.brand,model:b.model,source:'Bill Sheet (purani)'}); c=STATE.customers[STATE.customers.length-1]; }
            b.customerId=c.id; await saveKey(SKEY.BILLS,STATE.bills); linkBillsToCustomer(c); showToast('Bill customer se jud gaya'); activeModal=null; render(); } }
      } else if(activeModal.type==='reschedJob'){
        const ok=await rescheduleJob(activeModal.data.id, val('f_newDate'), val('f_reschWhy')); if(ok){ activeModal=null; render(); }
      } else if(activeModal.type==='amcSign'){
        const sigUrl=getSignatureDataUrl('sigCanvas');
        if(!sigUrl){ showToast('Pehle sign karein'); return; }
        await saveAmcSignature(activeModal.data.id, sigUrl); activeModal=null; render();
      }
      }finally{ resetBtn(); }
    };
  }
}
async function lookupPincode(pin){
  const box=document.getElementById('pinNote'); if(!box) return;
  if(!/^\d{6}$/.test(pin)){ box.innerHTML=''; return; }
  box.innerHTML='<div class="item-sub">Pincode check ho raha hai…</div>';
  try{ const res=await fetch('https://api.postalpincode.in/pincode/'+pin), data=await res.json(), po=data&&data[0]&&data[0].Status==='Success'?data[0].PostOffice:null;
    if(!po||!po.length){ box.innerHTML='<div class="item-sub">Ye pincode nahi mila, city/state khud likhein.</div>'; return; }
    const city=document.getElementById('f_city'), state=document.getElementById('f_state');
    if(city) city.value=po[0].District; if(state) state.value=po[0].State;
    const areas=[...new Set(po.map(p=>p.Name))];
    box.innerHTML='<div class="item-sub">✅ '+esc(po[0].District)+', '+esc(po[0].State)+(areas.length?' — Area: '+areas.map(a=>esc(a)).join(', '):'')+'</div>';
  }catch(e){ box.innerHTML='<div class="item-sub">Pincode check nahi ho paya — internet check karein ya khud bharein.</div>'; }
}

function techNameOptHtml(){

function wireLeadAssign(){
  const w=document.getElementById('f_laWhen'); if(!w) return;
  const paint=()=>{
    const past=w.value==='past', nw=document.getElementById('laNew'), pa=document.getElementById('laPast'), btn=document.getElementById('modalSave');
    if(nw) nw.style.display=past?'none':''; if(pa) pa.style.display=past?'':'none'; if(btn) btn.textContent=past?'AMC Record Save Karo':'Job Banao';
  };
  w.onchange=paint; paint();
  const done=document.getElementById('f_paDone'), tot=document.getElementById('f_paTotal'), rows=document.getElementById('paRows'), left=document.getElementById('paLeft');
  const upd=()=>{
    const n=Number(done.value)||0, t=Number(tot.value)||0;
    for(let i=0;i<n;i++){ if(!document.getElementById('paRow'+i)){ const dv=document.createElement('div'); dv.id='paRow'+i; dv.className='card'; dv.style.cssText='padding:10px;margin-bottom:8px;'; dv.innerHTML=`<div class="item-sub" style="font-weight:700;margin-bottom:6px;">Service ${i+1}</div><div class="field" style="margin-bottom:6px;"><label>Date</label>${dmyPickHtml('ps'+i,'')}</div><div class="field" style="margin-bottom:6px;"><label>Technician</label><select id="f_psT${i}">${techNameOptHtml()}</select><input id="f_psO${i}" placeholder="Technician ka naam" style="display:none;margin-top:6px;"></div><div class="field" style="margin-bottom:0;"><label>Note (optional)</label><input id="f_psN${i}" placeholder="kya kaam hua"></div>`; rows.appendChild(dv); const sel=dv.querySelector('#f_psT'+i); sel.onchange=()=>{ dv.querySelector('#f_psO'+i).style.display=sel.value==='__other'?'':'none'; }; } }
    for(let i=n;i<60;i++){ const e=document.getElementById('paRow'+i); if(!e) break; e.remove(); }
    left.innerHTML=t?(n>t?'⚠️ Ho chuki services kul se zyada hain':'📋 Kul <b>'+t+'</b> · ho chuki <b>'+n+'</b> · baaki <b>'+(t-n)+'</b>'):'';
  };
  done.onchange=upd; tot.oninput=upd; upd();
}
/* Purani date ki AMC (lead se): job/technician assign nahi — sirf record */
function readPastAmcForm(){
  const start=dmyVal('pa'); if(!start){ return {err:'AMC ki shuruaat ki sahi date (din/mahina/saal) chunein'}; }
  if(start>todayStr()){ return {err:'Purani AMC ki date aaj se pehle ki honi chahiye'}; }
  const years=Number(val('f_paYears'))||1, total=Number(val('f_paTotal'))||0, done=Number(val('f_paDone'))||0;
  if(total<1) return {err:'Kul services daalein'};
  if(done>total) return {err:'Ho chuki services kul se zyada hain'};
  const svcs=[]; let prev='';
  for(let i=0;i<done;i++){
    const dt=dmyVal('ps'+i); if(!dt) return {err:'Service '+(i+1)+' ki sahi date chunein'};
    if(dt<start) return {err:'Service '+(i+1)+' ki date AMC shuru hone se pehle ki hai'};
    if(dt>todayStr()) return {err:'Service '+(i+1)+' ki date aage ki hai — ho chuki service ki date aaj tak ki hogi'};
    const ts=val('f_psT'+i); let tech='', techId='';
    if(ts==='__other'){ tech=val('f_psO'+i).trim(); if(!tech) return {err:'Service '+(i+1)+' ke technician ka naam likhein'}; }
    else if(ts){ techId=ts; tech=nStaff(ts)||''; }
    svcs.push({date:dt,tech,techId,note:val('f_psN'+i).trim()});
  }
  svcs.sort((a,b)=>a.date.localeCompare(b.date));
  return {start,years,total,done,svcs,amount:Number(val('f_paAmt'))||0,mode:val('f_paMode'),note:val('f_paNote').trim()};
}
async function convertLeadToPastAmc(id,f){
  const l=(STATE.leads||[]).find(x=>x.id===id); if(!l||l.convertedJobId||l.markedDone) return;
  const mob=ph10(l.mobile), mob2=ph10(l.resTel);
  let cust=dupCustomerByPhone(l.mobile,l.resTel);
  const addr=[l.address1,l.address2,l.address3].filter(Boolean).join(', ');
  const end=addMonths(f.start,12*f.years), lastSvc=f.svcs.length?f.svcs[f.svcs.length-1].date:'';
  const hist={start:f.start,end,years:f.years,units:0,amount:f.amount,services:f.svcs.map(s=>s.date),svcDetails:f.svcs.map(s=>({date:s.date,tech:s.tech,note:s.note})),tech:'',teli:String(l.calledBy||l.assignedName||''),desc:f.note,renewalNote:'',status:end<todayStr()?'expired':'active',mode:normMode(f.mode),srcRow:0,inApp:true,pastEntry:true,by:(STATE.session&&STATE.session.name)||'',at:Date.now()};
  const log=f.svcs.map((s,i)=>({date:new Date(s.date+'T12:00:00').getTime(),visitNo:i+1,manual:false,pastEntry:true,tech:s.tech,note:s.note,by:s.tech||'(purani entry)'}));
  if(!cust){
    cust={id:uid(), name:l.customer||'Naya Customer', type:'amc', phone:l.mobile||'', phone2:l.resTel||'', email:'', address:addr, landmark:'', city:'', state:'', pincode:'', brand:'', model:l.product||'', acType:'', serialNo:'', installDate:l.purchaseDate||'', underWarranty:false, amcName:'AMC', activationDate:f.start, expiryDate:end, totalServices:f.total, servicesDone:f.done, source:'Telecaller — '+(l.calledBy||l.assignedName||''), sourceType:'telecaller', amcAmount:f.amount, autoIncentive:true, incentiveGiven:true, incentiveTo:(l.calledBy||l.assignedName||'Telecaller'), incentiveAmount:0, incentivePaid:false, lastService:lastSvc||f.start, intervalMonths:3, notes:('Area: '+(l.area||'')+(f.note?' · '+f.note:'')), serviceLog:log, amcHistory:[hist], createdAt:Date.now()};
  } else {
    /* pehle se profile hai: usi mein nayi (purani) contract jodo, naya customer nahi */
    cust.type='amc'; cust.amcHistory=(cust.amcHistory||[]).concat(hist);
    if(!cust.activationDate||f.start>=cust.activationDate){ cust.activationDate=f.start; cust.expiryDate=end; cust.totalServices=f.total; cust.servicesDone=f.done; cust.amcAmount=f.amount||cust.amcAmount; cust.serviceLog=log; if(lastSvc) cust.lastService=lastSvc; }
    if(f.note) cust.notes=(cust.notes?cust.notes+'\n':'')+f.note;
    if(!cust.model&&l.product) cust.model=l.product;
  }
  cust.leadTelecaller=l.assignedName||cust.leadTelecaller||''; cust.leadCalledBy=l.calledBy||''; cust.leadId=l.id;
  STATE.customers=STATE.customers.filter(x=>x.id!==cust.id).concat(cust); await saveKey(SKEY.CUSTOMERS, STATE.customers);
  l.markedDone=true; l.doneDate=f.start; l.doneBy=(STATE.session&&STATE.session.name)||''; l.doneAt=Date.now(); l.doneCustId=cust.id; l.followUpDate='';
  if(!l.called){ l.called=true; l.calledAt=Date.now(); l.calledBy=l.calledBy||'(purani AMC)'; }
  await saveKey(SKEY.LEADS, STATE.leads);
  showToast('✅ Purani AMC record ho gayi — '+f.done+'/'+f.total+' service, koi job nahi bani');
  STATE.customerDetailId=cust.id; STATE.backView=STATE.view; STATE.view='customerProfile'; render();
}
